<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoshimjon va sehrli qalpoqcha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
#dlg.hard .choice small{display:none!important}
/* Yo'nalish: Toshkent kechki quyoshi. Indigo fon, qalpoq kremi, firuza va oltin urg'u. Bitta dunyo, bitta mavzu. */
:root{
  --ink:#171a29; --ink2:#232840; --ink3:#2f3556;
  --paper:#f7edd8; --paper2:#ecdcb8; --line:#d9c79f;
  --sky:#1f93a8; --sky2:#147385;
  --gold:#f2b035; --gold2:#c98a12;
  --clay:#c8452f; --leaf:#3f9a62;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ink);touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}

/* HUD */
.hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.hud-l{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.hearts{display:flex;gap:4px;background:rgba(23,26,41,.72);padding:6px 10px;border-radius:999px;border:2px solid rgba(255,255,255,.12)}
.hearts svg{width:24px;height:24px;fill:var(--clay);transition:transform .2s,fill .2s}
.hearts svg.off{fill:#4a4d63;transform:scale(.82)}
.pill{background:rgba(23,26,41,.78);border:2px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px}
.pill b{background:var(--gold);color:var(--ink);border-radius:999px;padding:1px 8px;margin-left:6px}
.pill:hover{border-color:var(--gold)}
.obj{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(440px,calc(100% - 250px));background:rgba(23,26,41,.8);border:2px solid rgba(255,255,255,.14);border-radius:16px;padding:9px 14px;text-align:left}
.obj small{display:block;font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.obj b{display:block;font:700 18px/1.15 var(--display)}
.obj span{display:block;font-size:13px;color:#d6d1c4;margin-top:2px}
.compass{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.ring{width:64px;height:64px;border-radius:50%;background:rgba(23,26,41,.78);border:3px solid var(--gold);position:relative}
.arrow{position:absolute;left:50%;top:50%;width:0;height:0;margin:-24px 0 0 -9px;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:26px solid var(--gold);transform-origin:9px 24px}
.dist{font:800 12px var(--body);background:rgba(23,26,41,.78);border-radius:999px;padding:2px 9px}
#hint{position:absolute;left:14px;bottom:14px;font-size:13px;background:rgba(23,26,41,.78);border-radius:12px;padding:8px 12px;max-width:320px;line-height:1.35;transition:opacity .8s;z-index:5}
#prompt{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:6;background:var(--gold);color:var(--ink);border:0;border-radius:999px;padding:12px 22px;font:800 16px var(--body);box-shadow:0 6px 0 var(--gold2),0 10px 24px rgba(0,0,0,.35)}
#prompt:active{transform:translateX(-50%) translateY(3px);box-shadow:0 3px 0 var(--gold2)}
#joy{position:absolute;right:22px;bottom:22px;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);z-index:5;touch-action:none;display:none}
#stick{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(247,237,216,.85);box-shadow:0 3px 10px rgba(0,0,0,.35)}
@media (pointer:coarse){#joy{display:block}#hint{display:none}}

/* Dialog */
#dlg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(760px,calc(100% - 20px));max-height:66%;z-index:8;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border-radius:22px;border:3px solid var(--ink);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.d-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--ink2);color:var(--paper);border-radius:18px 18px 0 0}
.d-head .who{display:flex;align-items:center;gap:8px;min-width:0}
.d-head .who b{font:700 18px var(--display)}
.d-head .who span{font-size:13px;color:#c9c4b6}
.dot{width:12px;height:12px;border-radius:50%;background:var(--gold);flex:none}
.chip{background:transparent;border:2px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 12px;font:800 13px var(--body);color:inherit}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.log{flex:1 1 auto;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:90px}
.row{display:flex;flex-direction:column;max-width:88%}
.row.npc{align-self:flex-start}
.row.me{align-self:flex-end;align-items:flex-end}
.bub{padding:9px 13px;border-radius:16px;font-size:17px;line-height:1.45;font-weight:700}
.row.npc .bub{background:#fff;border:2px solid var(--line);border-top-left-radius:4px}
.row.me .bub{background:var(--sky);color:#fff;border-top-right-radius:4px}
.sys .bub,.row.sys .bub{background:var(--clay);color:#fff}
.uzl{display:none;font-size:13px;font-weight:600;color:#6b6350;margin-top:3px;padding:0 4px}
.row.me .uzl{color:#4b5d63}
.show-uz .uzl{display:block}
.spk{margin-left:8px;background:var(--paper2);border:0;border-radius:999px;padding:2px 10px;font:800 12px var(--body);color:var(--ink);vertical-align:middle}
.w{background:rgba(242,176,53,.28);border:0;border-bottom:3px solid var(--gold);border-radius:6px 6px 2px 2px;padding:0 4px;margin:0 1px;font:800 inherit;font-size:inherit;color:var(--ink);cursor:pointer}
.w:hover{background:rgba(242,176,53,.55)}
.w.saved{background:rgba(63,154,98,.25);border-bottom-color:var(--leaf)}
.wcard{margin:0 14px 8px;padding:12px 14px;background:var(--ink2);color:var(--paper);border-radius:16px;position:relative;border:2px solid var(--gold)}
.wc-top{display:flex;align-items:center;gap:10px;padding-right:30px}
.wc-top b{font:800 22px var(--display)}
.wc-uz{font-size:18px;font-weight:800;color:var(--gold);margin-top:2px}
.wc-g{font-size:14px;line-height:1.4;margin-top:6px;color:#e5dfce}
.wc-ex{font-size:14px;margin-top:6px;font-style:italic;color:#bfe3ea}
.wcard .x{position:absolute;right:8px;top:6px;border:0;background:transparent;font-size:26px;line-height:1;color:#c9c4b6}
.save{margin-top:10px;background:var(--gold);color:var(--ink);border:0;border-radius:12px;padding:8px 16px;font:800 14px var(--body)}
.save.on{background:var(--leaf);color:#fff}
.choices{padding:4px 14px 14px;display:flex;flex-direction:column;gap:8px}
.choice{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font:700 16px/1.3 var(--body);color:var(--ink);box-shadow:0 3px 0 var(--ink);position:relative;padding-left:44px}
.choice .k{position:absolute;left:10px;top:9px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:13px;display:grid;place-items:center}
.choice:hover:not(:disabled){background:#fff6df}
.choice:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.choice.wrong{background:#f6d4cc;border-color:var(--clay);box-shadow:0 3px 0 var(--clay);opacity:.9}
.why{font-size:14px;font-weight:700;color:#8a2a1a;background:#fbe4de;border-radius:10px;padding:7px 10px;margin-top:-2px}
.choice small{display:none;margin-top:3px;font-weight:600;color:#6b6350}
.show-uz .choice small{display:block}

/* Overlay screens */
#ov{position:absolute;inset:0;z-index:20;overflow-y:auto;background:linear-gradient(180deg,rgba(23,26,41,.55),rgba(23,26,41,.82))}
.scr{min-height:100%;display:flex;align-items:center;justify-content:center;gap:34px;padding:24px;flex-wrap:wrap}
.hero{display:block;height:min(66vh,520px);width:auto;border-radius:28px;border:4px solid var(--gold);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.t-right{max-width:520px}
.eyebrow{font:800 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
h1{font:800 clamp(34px,6vw,58px)/.98 var(--display);margin:0 0 12px;text-wrap:balance}
h1 span{color:var(--gold)}
.lead{font-size:17px;line-height:1.5;color:#e6e0d0;margin:0 0 18px;max-width:46ch}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.28);border-radius:14px;padding:12px 20px;font:800 16px var(--body)}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:var(--ink);border-color:var(--gold);box-shadow:0 5px 0 var(--gold2)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold2)}
.faces{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:22px}
.faces figure{margin:0;text-align:center;font-size:11px;font-weight:800;color:#c9c4b6}
.faces img{display:block;width:100%;aspect-ratio:128/166;object-fit:cover;border-radius:12px;border:2px solid rgba(255,255,255,.2);margin-bottom:3px}
.card{background:var(--paper);color:var(--ink);border-radius:26px;border:4px solid var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.5);padding:22px;width:min(720px,100%)}
.card h2{font:800 30px/1.05 var(--display);margin:0 0 6px}
.card p{margin:0 0 12px;line-height:1.5}
.story{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.story img{width:150px;border-radius:20px;border:3px solid var(--ink)}
.story .txt{flex:1;min-width:220px;font-size:19px;line-height:1.5;font-weight:700}
.stars{font:800 40px var(--display);color:var(--gold2);letter-spacing:.1em}
.stars .off{color:#cdbf9b}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.cw{background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 11px;font-weight:800;font-size:14px}
.cw.on{background:rgba(63,154,98,.18);border-color:var(--leaf)}
.cw button{border:0;background:transparent;font-weight:800;font-size:14px;padding:0}
.sub{font:800 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:#6b6350;margin:10px 0 2px}
.cat{width:min(860px,100%)}
.tabs{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
.tab{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 16px;font:800 14px var(--body);color:var(--ink)}
.tab.on{background:var(--ink);color:var(--paper)}
.wl{display:grid;gap:8px}
.wi{background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 12px;position:relative}
.wi b{font:800 18px var(--display)}
.wi .u{color:var(--sky2);font-weight:800;margin-left:8px}
.wi .g{font-size:13px;color:#5b5440;margin-top:3px;line-height:1.4}
.wi .e{font-size:13px;font-style:italic;margin-top:2px;color:#2f6a78}
.wi .rm{position:absolute;right:8px;top:6px;border:0;background:transparent;font-size:22px;color:#a9a08a}
.lock{background:repeating-linear-gradient(135deg,#efe3c6,#efe3c6 12px,#e8d9b6 12px,#e8d9b6 24px);border:3px dashed var(--gold2);border-radius:18px;padding:18px;text-align:center}
.lock h3{font:800 24px var(--display);margin:0 0 6px}
.fc{perspective:900px;margin:8px 0}
.fc-card{min-height:170px;display:grid;place-items:center;text-align:center;padding:18px;background:var(--ink2);color:var(--paper);border:3px solid var(--gold);border-radius:20px;cursor:pointer;font:700 28px/1.2 var(--display)}
.fc-card small{display:block;font:600 15px/1.4 var(--body);color:#e5dfce;margin-top:8px}
.fc-card em{display:block;font:600 15px var(--body);color:#bfe3ea;margin-top:6px}
.qs{font-size:22px;font-weight:800;line-height:1.35;margin:6px 0 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:10px;font:800 16px var(--body);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.opt.good{background:#cfeadb;border-color:var(--leaf);box-shadow:0 3px 0 var(--leaf)}
.opt.bad{background:#f6d4cc;border-color:var(--clay);box-shadow:0 3px 0 var(--clay)}
.row-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:14px}
.note{font-size:13px;color:#6b6350;margin-top:8px}
#toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:var(--ink2);border:2px solid var(--gold);border-radius:12px;padding:9px 16px;font-weight:800;font-size:14px;z-index:30;max-width:calc(100% - 28px);text-align:center}
@media (max-width:640px){
  .obj{left:14px;right:90px;width:auto;transform:none;top:14px}
  .hud-l{top:96px}
  .scr{gap:14px;padding:14px}
  .hero{height:34vh}
  .faces{grid-template-columns:repeat(3,1fr)}
  .bub{font-size:16px}
  #dlg{max-height:72%}
  .in-dlg .obj,.in-dlg .compass{display:none}
  .in-dlg .hud-l{top:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="3D shahar"></canvas>
  <div id="hud" class="hud hidden">
    <div class="hud-l">
      <div class="hearts" id="hearts" title="Kuch"></div>
      <button class="pill" id="bWords">So'zlar katalogi<b id="wCount">0</b></button>
    </div>
    <div class="obj" id="obj"></div>
    <div class="compass"><div class="ring"><div class="arrow" id="arrow"></div></div><div class="dist" id="dist"></div></div>
  </div>
  <div id="hint" class="hidden">WASD yoki o'qlar: yurish. Shift: yugurish. Sichqoncha bilan sudrang: kamera. E: gaplashish.</div>
  <button id="prompt" class="hidden"></button>
  <div id="joy"><div id="stick"></div></div>
  <div id="dlg" class="hidden">
    <div class="d-head">
      <div class="who"><span class="dot"></span><b id="dName"></b><span id="dRole"></span></div>
      <div><button class="chip" id="dUz">Tarjima</button> <button class="chip" id="dClose">Chiqish</button></div>
    </div>
    <div class="log" id="dLog"></div>
    <div class="wcard hidden" id="dCard"></div>
    <div class="choices" id="dChoices"></div>
  </div>
  <div id="ov" class="hidden"></div>
  <div id="toast" class="hidden"></div>
</div>
<script src="lib/three.min.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script>
const IMG = {"main": "img/main.jpg", "happy": "img/happy.jpg", "surprised": "img/surprised.jpg", "thinking": "img/thinking.jpg", "confident": "img/confident.jpg", "excited": "img/excited.jpg", "focused": "img/focused.jpg"};
</script>
<script>
/* ---------- Lug'at: {kalit} bilan belgilangan so'z va iboralar ---------- */
const LEX = {
  'Good morning': { uz: "Xayrli tong", g: "Salomlashish: Good morning (ertalab), Good afternoon (tushdan keyin), Good evening (kechqurun).", ex: "Good morning, teacher!" },
  'Good evening': { uz: "Xayrli kech", g: "Kechqurun salomlashish va xayrlashish uchun. Yotishdan oldin esa Good night deyiladi.", ex: "Good evening, everyone." },
  'get': { uz: "olib bermoq, bermoq", g: "'What can I get you?' xizmat ko'rsatuvchining odatiy savoli: Sizga nima olib beray?", ex: "What can I get you?" },
  'How many': { uz: "nechta (sanaladigan otlar uchun)", g: "How many + ko'plikdagi ot: How many books? Sanalmaydigan otlar uchun How much ishlatiladi.", ex: "How many loaves would you like?" },
  'loaves': { uz: "nonlar (loaf - bitta non)", g: "Tartibsiz ko'plik: loaf → loaves (f harfi ves ga almashadi).", ex: "Two loaves of bread, please." },
  'whole grain': { uz: "to'liq donli (butun donli non)", g: "Ikki so'zli sifat: whole grain bread. Artikl kerak emas.", ex: "I prefer whole grain bread." },
  'three dollars': { uz: "uch dollar", g: "Pul miqdori: son + dollars (ko'plikda -s). Bitta bo'lsa one dollar.", ex: "That's three dollars." },
  'in total': { uz: "jami, hammasi bo'lib", g: "Hisob-kitobda ishlatiladi: That's six dollars in total.", ex: "That's six dollars in total." },
  'anything else': { uz: "yana biror narsa", g: "Savol gapda anything (some emas): Would you like anything else?", ex: "Would you like anything else?" },
  'Have a nice day': { uz: "Kuningiz yaxshi o'tsin", g: "Xayrlashish iborasi. Javob: You too! (Sizga ham!)", ex: "Have a nice day, Anna!" },
  'Come back': { uz: "qaytib keling", g: "come back - qaytib kelmoq (phrasal verb). Buyruq shaklida fe'l boshlanadi.", ex: "Come back soon!" },
  'sell': { uz: "sotmoq", g: "sell - sold - sold (tartibsiz fe'l). Teskarisi: buy.", ex: "They sell fresh milk here." },

  'looking for': { uz: "izlayapman, izlayapsiz", g: "look for + ot: izlamoq. look - qaramoq, look for - izlamoq. Hozirgi davom zamonida: am/is/are looking for.", ex: "I am looking for a new phone." },
  'job': { uz: "ish, ish o'rni", g: "job - aniq ish o'rni (sanaladi: a job). work - ish jarayoni (sanalmaydi).", ex: "He has a good job." },
  'Nice to meet you': { uz: "Tanishganimdan xursandman", g: "Birinchi uchrashuvda aytiladi. Javob: Nice to meet you too.", ex: "Nice to meet you, Anna!" },
  'Where are you from': { uz: "Siz qayerdansiz?", g: "from - qayerdan. Javob: I am from + mamlakat/shahar.", ex: "Where are you from, Ali?" },
  'experience': { uz: "tajriba", g: "Sanalmaydigan ot: I have experience. (an experience emas.)", ex: "I have no experience." },
  'wash dishes': { uz: "idish-tovoq yuvmoq", g: "wash the dishes yoki do the dishes ham deyiladi. can dan keyin fe'l asosiy shaklda: I can wash dishes.", ex: "I wash dishes every evening." },
  'clean tables': { uz: "stollarni tozalamoq", g: "Fe'l + ko'plikdagi ot: clean tables (aniq stollar bo'lsa the tables).", ex: "Please clean tables after lunch." },
  'When': { uz: "qachon", g: "Vaqt haqida savol so'zi. Javob: at eight, tomorrow, on Monday.", ex: "When can we meet?" },
  "eight o'clock": { uz: "soat sakkiz", g: "o'clock - aniq soat (yarim yoki chorak bo'lmaganda): at eight o'clock.", ex: "The shop opens at eight o'clock." },
  'Welcome to the team': { uz: "Jamoaga xush kelibsiz", g: "Yangi xodimni kutib olish iborasi.", ex: "Welcome to the team, everyone!" },
  'per hour': { uz: "soatiga", g: "per + vaqt birligi: per hour, per day, per week.", ex: "He drives sixty kilometers per hour." },
  'tomorrow': { uz: "ertaga", g: "Kelasi vaqt ko'rsatkichi: I will call you tomorrow. Aytilishi: See you tomorrow!", ex: "I will call you tomorrow." },
  'busy': { uz: "band", g: "be + busy: I am busy. Teskarisi: free (bo'sh).", ex: "I am busy today." },

  'reservation': { uz: "bron qilish, band qilingan joy", g: "Mehmonxonada: Do you have a reservation? Bron qilganmisiz?", ex: "I have a reservation for two." },
  'single room': { uz: "bir kishilik xona", g: "double room - ikki kishilik xona. Sifat + ot birikmasi.", ex: "I need a single room for two nights." },
  'per night': { uz: "kechasiga", g: "per + vaqt birligi: narxni bildiradi (per night, per week).", ex: "The room is fifty dollars per night." },
  'How would you like to pay': { uz: "Qanday to'lamoqchisiz?", g: "How would you like...? muloyim so'rov. Javob: I'll pay in cash / by card.", ex: "How would you like to pay, cash or card?" },
  'passport': { uz: "pasport", g: "Hujjat so'ralganda: Could I see your passport, please?", ex: "Please show your passport." },
  'check out': { uz: "mehmonxonadan hisob-kitob qilib chiqmoq", g: "Phrasal verb: check in - kirish, check out - chiqish. Ot sifatida: checkout.", ex: "We check out at noon." },

/* So'zlar matn ichida {kalit} ko'rinishida; shu funksiya qism bo'yicha barcha kalitlarni yig'adi */
function collectKeys(npc) {
  const out = [];
  Object.values(npc.tree).forEach(n => {
    (n.say.match(/\{([^}]+)\}/g) || []).forEach(m => {
      const k = m.slice(1, -1);
      if (!out.includes(k)) out.push(k);
    });
  });
  return out;
}

function rigModel(model) {
  model.updateMatrixWorld(true);
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.82, metalness: 0, flatShading: true });   // modelda normal yo'q: tekis soyalash
  const meshes = []; model.traverse(o => { if (o.isMesh) meshes.push(o); });
  const all = new THREE.Box3();
  const info = meshes.map(m => {
    m.material = mat; m.castShadow = true; m.receiveShadow = true;
    const b = new THREE.Box3().setFromObject(m); all.union(b);
    return { m, y: (b.min.y + b.max.y) / 2, name: (m.name || '').toLowerCase() };
  });
  const NECK = 1.45;
  const headG = new THREE.Group(); headG.position.set(0, NECK, 0); model.add(headG);
  const eyes = info.filter(i => /eye_white|iris|pupil|eye_glint/.test(i.name));
  const mouth = info.filter(i => /smile|mouth|lip/.test(i.name));
  const mid = arr => arr.reduce((a, i) => a + i.y, 0) / Math.max(1, arr.length);
  const eyesG = new THREE.Group(), mouthG = new THREE.Group();
  eyesG.position.set(0, (eyes.length ? mid(eyes) : 1.83) - NECK, 0);
  mouthG.position.set(0, (mouth.length ? mid(mouth) : 1.6) - NECK, 0);
  headG.add(eyesG); headG.add(mouthG);
  model.updateMatrixWorld(true);
  eyes.forEach(i => eyesG.attach(i.m)); mouth.forEach(i => mouthG.attach(i.m));
  info.forEach(i => { if (i.m.parent !== eyesG && i.m.parent !== mouthG && i.y > NECK + 0.07 && !/neck|shoulder/.test(i.name)) headG.attach(i.m); });
  const group = new THREE.Group(); group.scale.setScalar(NPC_SCALE); group.add(model);
  return { group, top: all.max.y, rig: { head: headG, eyes: eyesG, mouth: mouthG, mouthBase: 1 } };
}

  if (!THREE.GLTFLoader) return;

}

function nearestNpc() {
  let best = null, bd = 3.8;
  for (const n of NPC) { const d = Math.hypot(n.pos.x - player.pos.x, n.pos.z - player.pos.z); if (d < bd) { bd = d; best = n; } }

function collide(p, r) {
  for (const b of boxes) {
    const cx = clamp(p.x, b.x0, b.x1), cz = clamp(p.z, b.z0, b.z1);
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 < r * r) {
      if (d2 > 1e-6) { const d = Math.sqrt(d2); p.x = cx + dx / d * r; p.z = cz + dz / d * r; }
      else {
        const l = p.x - b.x0, rr = b.x1 - p.x, t = p.z - b.z0, bt = b.z1 - p.z, m = Math.min(l, rr, t, bt);
        if (m === l) p.x = b.x0 - r; else if (m === rr) p.x = b.x1 + r; else if (m === t) p.z = b.z0 - r; else p.z = b.z1 + r;
      }
    }
  }
  for (const c of circles) {
    const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), m = c.r + r;
    if (d < m && d > 1e-6) { p.x = c.x + dx / d * m; p.z = c.z + dz / d * m; }
  }
}

function updateCamera(dt) {
  let tx, ty, tz, dist = 10, pitch = camPitch;
  if (S.mode === 'title' || S.mode === 'story' || S.mode === 'summary' || S.mode === 'end' || S.mode === 'catalog' && !S.started) {
    camYaw += dt * 0.1; tx = 0; ty = 2.5; tz = 0; dist = 34; pitch = 0.33;
  } else if (S.mode === 'dialog' && D) {
    const mx = (player.pos.x + D.npc.pos.x) / 2, mz = (player.pos.z + D.npc.pos.z) / 2;
    tx = mx; ty = camera.aspect < 1 ? -0.6 : 0.0; tz = mz; dist = camera.aspect < 1 ? 10.5 : 8.6; pitch = 0.2;
    const a = Math.atan2(D.npc.pos.x - player.pos.x, D.npc.pos.z - player.pos.z);
    const y1 = a + Math.PI / 2, y2 = a - Math.PI / 2;
    const tgt = Math.abs(angDiff(camYaw, y1)) < Math.abs(angDiff(camYaw, y2)) ? y1 : y2;
    camYaw += angDiff(camYaw, tgt) * Math.min(1, dt * 3);
  } else { tx = player.pos.x; ty = 1.6; tz = player.pos.z; dist = 9.5; }
  const k = 1 - Math.exp(-dt * 6);
  focus.x += (tx - focus.x) * k; focus.y += (ty - focus.y) * k; focus.z += (tz - focus.z) * k;
  camDist += (dist - camDist) * k;
  camera.position.set(focus.x + Math.sin(camYaw) * Math.cos(pitch) * camDist, focus.y + Math.sin(pitch) * camDist, focus.z + Math.cos(camYaw) * Math.cos(pitch) * camDist);
  if (camera.position.y < 1.2) camera.position.y = 1.2;
  camera.lookAt(focus);
}

function update(dt) {
  T += dt;
  const P = hero.P;
  let moving = 0;
  if (S.mode === 'play') {
    if (keys.q) camYaw += dt * 1.8; if (keys.r) camYaw -= dt * 1.8;
    let ix = (keys.d || keys.ArrowRight ? 1 : 0) - (keys.a || keys.ArrowLeft ? 1 : 0) + jv.x;
    let iz = (keys.w || keys.ArrowUp ? 1 : 0) - (keys.s || keys.ArrowDown ? 1 : 0) + jv.y;
    const len = Math.hypot(ix, iz);
    if (len > 1) { ix /= len; iz /= len; }
    const mag = Math.min(1, len);
    if (mag > 0.08) {
      const run = keys.Shift ? 1.7 : 1, spd = 5.4 * run * mag;
      const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
      let dx = fx * iz + rx * ix, dz = fz * iz + rz * ix; const dl = Math.hypot(dx, dz); dx /= dl; dz /= dl;
      player.pos.x += dx * spd * dt; player.pos.z += dz * spd * dt;
      collide(player.pos, 0.55);
      player.pos.x = clamp(player.pos.x, -58, 58); player.pos.z = clamp(player.pos.z, -58, 58);
      player.rot += angDiff(player.rot, Math.atan2(dx, dz)) * Math.min(1, dt * 14);
      moving = mag * run; player.walkT += dt * (8 + 3 * run);
    }
  }
  if (S.mode === 'dialog' && D) {
    const a = Math.atan2(D.npc.pos.x - player.pos.x, D.npc.pos.z - player.pos.z);
    player.rot += angDiff(player.rot, a) * Math.min(1, dt * 6);
  }
  hero.root.position.set(player.pos.x, 0, player.pos.z); hero.root.rotation.y = player.rot;
  const sw = Math.sin(player.walkT) * 0.75 * Math.min(1, moving);
  P.legL.rotation.x = sw; P.legR.rotation.x = -sw; P.armL.rotation.x = -sw * 0.9; P.armR.rotation.x = sw * 0.9;
  hero.g.position.y = moving ? Math.abs(Math.sin(player.walkT)) * 0.07 : Math.sin(T * 2) * 0.015;
  P.mouth.scale.y = D && D.heroTalk ? 0.5 + Math.abs(Math.sin(T * 14)) * 1.0 : 0.5;
  if (moving === 0) { P.legL.rotation.x *= 0.8; P.legR.rotation.x *= 0.8; }

  const active = CHAPTERS[S.chapter - 1] && npcById(CHAPTERS[S.chapter - 1].npc);
  for (const n of NPC) {
    const d = Math.hypot(n.pos.x - player.pos.x, n.pos.z - player.pos.z);
    let tr = n.baseRot;
    if (d < 9 && S.mode !== 'title') tr = Math.atan2(player.pos.x - n.pos.x, player.pos.z - n.pos.z);
    n.root.rotation.y += angDiff(n.root.rotation.y, tr) * Math.min(1, dt * 5);
    n.body.position.y = Math.sin(T * 1.8 + n.phase) * 0.02;
    const talking = D && D.npc === n && D.npcTalk, r = n.rig;
    if (r.head) r.head.rotation.x = talking ? Math.sin(T * 8) * 0.07 : Math.sin(T * 1.2 + n.phase) * 0.02;
    if (r.mouth) r.mouth.scale.y = talking ? r.mouthBase * (0.7 + Math.abs(Math.sin(T * 13)) * 1.1) : r.mouthBase;
    if (r.eyes) r.eyes.scale.y = ((T + n.phase) % 4.3) < 0.12 ? 0.1 : 1;
    if (r.armR) r.armR.rotation.x = talking ? -0.6 + Math.sin(T * 5) * 0.2 : 0;
    n.marker.visible = (S.mode === 'play' || S.mode === 'dialog') && n === active && S.started;

  }

  clouds.forEach(c => { c.position.x += dt * 0.6; if (c.position.x > 130) c.position.x = -130; });
  updateCamera(dt);
  updateHud();
}

  showNode();
}
function syncUz() { $('#dlg').classList.toggle('show-uz', S.showUz); $('#dUz').classList.toggle('on', S.showUz); $('#dUz').textContent = S.showUz ? 'Tarjima: yoqiq' : 'Tarjima'; }
$('#dUz').addEventListener('click', () => { S.showUz = !S.showUz; syncUz(); });
$('#dClose').addEventListener('click', () => closeDialog());
function logRow(kind, html, uz, speakText) {
  const row = document.createElement('div'); row.className = 'row ' + kind;
  const b = document.createElement('div'); b.className = 'bub'; b.innerHTML = html;
  if (speakText) { const s = document.createElement('button'); s.className = 'spk'; s.textContent = 'Tinglash'; s.addEventListener('click', () => speak(speakText)); b.appendChild(s); }
  row.appendChild(b);
  if (uz) { const u = document.createElement('div'); u.className = 'uzl'; u.textContent = uz; row.appendChild(u); }
  dLog.appendChild(row); dLog.scrollTop = dLog.scrollHeight;
}
function showNode() {
  const node = D.tree[D.id]; D.nodeMiss = false;
  D.npcTalk = true; setTimeout(() => { if (D) D.npcTalk = false; }, 1500);
  logRow('npc', rich(node.say), node.uz, node.say);
  renderChoices(node);
}
function renderChoices(node) {
  dChoices.innerHTML = '';
  node.choices.forEach((c, i) => {
    const b = document.createElement('button'); b.className = 'choice';
    b.innerHTML = '<span class="k">' + (i + 1) + '</span>' + esc(c.t) + '<small>' + esc(c.uz) + '</small>';
    b.addEventListener('click', () => choose(i));
    dChoices.appendChild(b);
  });
}
function choose(i) {
  if (S.mode !== 'dialog' || !D || D.locked) return;
  const node = D.tree[D.id], c = node.choices[i]; if (!c) return;
  const btn = dChoices.querySelectorAll('.choice')[i];
  if (!btn || btn.disabled) return;
  if (c.ok) {
    if (!D.nodeMiss) note(node, true);
    D.locked = true; D.heroTalk = true; setTimeout(() => { if (D) D.heroTalk = false; }, 1400);
    logRow('me', esc(c.t), c.uz, c.t); dChoices.innerHTML = '';
    setTimeout(() => {
      if (!D) return;
      D.locked = false;
      if (c.next === 'END') endDialog(true); else { D.id = c.next; showNode(); }
    }, 750);
  } else {
    if (!D.nodeMiss) { D.nodeMiss = true; note(node, false); }
    btn.classList.add('wrong'); btn.disabled = true;
    const w = document.createElement('div'); w.className = 'why'; w.textContent = c.why; btn.after(w);
    if (D.run) {
      S.hearts = Math.max(0, S.hearts - 1); S.mistakes++; renderHearts();
      if (S.hearts <= 0) { D.locked = true; setTimeout(exhausted, 900); }
    }
  }
}
function exhausted() {
  if (!D) return;
  logRow('sys', "Hoshimjon charchadi. Dam olib, suhbatni qaytadan boshlaysiz.");
  dChoices.innerHTML = '<button class="choice" id="again"><span class="k">1</span>Qaytadan boshlash</button>';
  $('#again').addEventListener('click', () => {
    S.hearts = 3; S.mistakes = 0; renderHearts();
    D.id = 'n1'; D.locked = false; dLog.innerHTML = ''; dCard.classList.add('hidden'); showNode();
  });
}
function closeDialog() { endDialog(false); }
function endDialog(done) {
  const wasRun = D && D.run && D.npc.def.chapter === S.chapter, after = D && D.npc.def.afterEnd;
  if (done && D && D.adv) { S.topics[D.npc.def.id] = (S.topics[D.npc.def.id] || 0) + 1; persist(); }
  $('#dlg').classList.add('hidden'); dCard.classList.add('hidden'); app.classList.remove('in-dlg');
  D = null; S.mode = 'play';
  if (done && wasRun) completeChapter();
  else if (done && after === 'catalog') openCatalog(() => { hideOv(); S.mode = 'play'; });
}
dLog.addEventListener('click', e => { const b = e.target.closest('.w'); if (b) showCard(b.dataset.w); });
function showCard(k) {
  const e = LEX[k]; if (!e) return;
  const saved = !!S.saved[k];
  dCard.innerHTML = '<div class="wc-top"><b>' + esc(k) + '</b><button class="chip" data-a="say">Tinglash</button></div><button class="x" data-a="close" aria-label="Yopish">&times;</button>'
    + '<div class="wc-uz">' + esc(e.uz) + '</div><div class="wc-g">' + esc(e.g) + '</div><div class="wc-ex">' + esc(e.ex) + '</div>'
    + '<button class="save' + (saved ? ' on' : '') + '" data-a="save">' + (saved ? "Saqlandi. Olib tashlash" : "So'zni saqlash") + '</button>';
  dCard.classList.remove('hidden'); dCard.dataset.k = k;
  dLog.scrollTop = dLog.scrollHeight;
}
dCard.addEventListener('click', e => {
  const a = e.target.dataset.a, k = dCard.dataset.k; if (!a) return;
  if (a === 'close') dCard.classList.add('hidden');
  if (a === 'say') speak(k);
  if (a === 'save') { toggleSave(k, D && D.run ? D.npc.def.chapter : 0); showCard(k); }
});
function toggleSave(k, ch) {
  if (S.saved[k]) delete S.saved[k]; else S.saved[k] = { ch: ch || 0 };
  persist(); $('#wCount').textContent = savedCount();
  document.querySelectorAll('#dLog .w').forEach(b => { if (b.dataset.w === k) b.classList.toggle('saved', !!S.saved[k]); });
}

/* ================= EKRANLAR ================= */
const ov = $('#ov');
function showOv(html) { ov.innerHTML = html; ov.classList.remove('hidden'); ov.scrollTop = 0; }
function hideOv() { ov.classList.add('hidden'); ov.innerHTML = ''; }
const FACES = [['happy', 'Xursand'], ['surprised', 'Hayron'], ['thinking', "O'ylanmoqda"], ['confident', 'Ishonchli'], ['excited', 'Hayajonda'], ['focused', 'Diqqatli']];
function showTitle() {
  S.mode = 'title'; $('#hud').classList.add('hidden'); $('#hint').classList.add('hidden');
  showOv('<div class="scr"><img class="hero" src="' + IMG.main + '" alt="Hoshimjon">'
    + '<div class="t-right"><p class="eyebrow">3D til o\'rganish o\'yini</p>'
    + '<h1>Hoshimjon va <span>sehrli qalpoqcha</span></h1>'
    + '<p class="lead">Qalpoqchasi yo\'qolgach, Hoshimjon chet elda hech kimni tushunmaydi. Ovqat, ish va tunash joyi uchun u ingliz tilini suhbatlar orqali o\'rganishi kerak.</p>'
    + '<div class="btns"><button class="btn primary" data-act="start">O\'yinni boshlash</button><button class="btn" data-act="catalog">So\'zlar katalogi (' + savedCount() + ')</button></div>'
    + '<div class="faces">' + FACES.map(f => '<figure><img src="' + IMG[f[0]] + '" alt="' + f[1] + '">' + f[1] + '</figure>').join('') + '</div></div></div>');
}
const SLIDES = [
  { img: 'excited', text: "Hoshimjon sehrli qalpoqchasi bilan dunyodagi istalgan tilni tushunardi. Bugun u birinchi marta chet elga keldi." },
  { img: 'surprised', text: "Birdan kuchli shamol esdi va qalpoqcha uchib ketdi! Hoshimjon uni ushlay olmadi." },
  { img: 'thinking', text: "Endi u hech kimni tushunmaydi. Non sotib olish, ish topish va tunash uchun ingliz tilini o'zi o'rganishi kerak. Gaplashing, noma'lum so'zlar ustiga bosing va saqlang." }
];
let slideI = 0;
function showSlide() {
  S.mode = 'story'; const s = SLIDES[slideI];
  showOv('<div class="scr"><div class="card"><div class="story"><img src="' + IMG[s.img] + '" alt=""><div class="txt">' + esc(s.text) + '</div></div>'
    + '<div class="row-b"><button class="btn primary" data-act="next">' + (slideI < SLIDES.length - 1 ? 'Davom etish' : "Shaharga tushish") + '</button><span class="note">' + (slideI + 1) + ' / ' + SLIDES.length + '</span></div></div></div>');
}
function beginPlay() {
  S.started = true; S.mode = 'play'; hideOv();
  $('#hud').classList.remove('hidden'); renderHud();
  const h = $('#hint'); h.classList.remove('hidden'); h.style.opacity = 1; setTimeout(() => { h.style.opacity = 0; }, 12000);
}
function chapterKeys(ch) { return collectKeys(npcById(CHAPTERS[ch - 1].npc).def); }
function completeChapter() {
  S.mode = 'summary';
  const ch = CHAPTERS[S.chapter - 1], keys_ = chapterKeys(S.chapter);
  const stars = S.mistakes <= 1 ? 3 : S.mistakes <= 3 ? 2 : 1;
  const lv0 = S.level;
  if (stars === 3) S.level = Math.min(2, S.level + 1); else if (stars === 1) S.level = Math.max(0, S.level - 1);
  S.showUz = S.level === 0; persist();
  const lvNote = S.level > lv0 ? "Yaxshi natija. Keyingi qismda savollar qiyinroq bo'ladi." : S.level < lv0 ? "Keyingi qismda tarjimalar yordam beradi." : '';
  const mine = keys_.filter(k => S.saved[k]), rest = keys_.filter(k => !S.saved[k]);
  showOv('<div class="scr"><div class="card"><p class="eyebrow" style="color:#c98a12">Qism ' + ch.n + ' tugadi</p><h2>' + esc(ch.title) + '</h2>'
    + '<div class="stars">' + [1, 2, 3].map(i => '<span class="' + (i <= stars ? '' : 'off') + '">&#9733;</span>').join('') + '</div>'
    + '<p>Xatolar: ' + S.mistakes + '. Saqlagan so\'zlaringiz katalogga qo\'shildi.</p>'
    + '<p class="note">Daraja: <b>' + LEVEL_NAMES[S.level] + '</b>. ' + lvNote + '</p>'
    + '<div class="sub">Saqlangan so\'zlar (' + mine.length + ')</div><div class="chips">' + (mine.length ? mine.map(k => '<span class="cw on">' + esc(k) + '</span>').join('') : '<span class="note">Hali saqlanmagan.</span>') + '</div>'
    + (rest.length ? '<div class="sub">Bu qismdagi boshqa so\'zlar</div><div class="chips">' + rest.map(k => '<span class="cw"><button data-act="addw" data-k="' + esc(k) + '">+ ' + esc(k) + '</button></span>').join('') + '</div><button class="btn sm dark" data-act="addall">Hammasini katalogga qo\'shish</button>' : '')
    + '<div class="row-b"><button class="btn" data-act="catalog">So\'zlar katalogi</button><button class="btn primary" data-act="nextch">' + (S.chapter < CHAPTERS.length ? 'Keyingi qism' : 'Davom etish') + '</button></div></div></div>');
}
function showEnd() {
  S.mode = 'end'; setCap(true); $('#hud').classList.add('hidden');
  showOv('<div class="scr"><img class="hero" src="' + IMG.happy + '" style="height:auto;width:200px" alt="Hoshimjon xursand"><div class="card"><p class="eyebrow" style="color:#c98a12">Final</p><h2>Qalpoqcha topildi</h2>'
    + '<p>Keeper qalpoqchani favvora yonidan topib berdi. Lekin endi Hoshimjon bilib oldi: sehrli qalpoqchasiz ham, bilim bilan har qanday tilda gaplasha oladi.</p>'
    + '<p>Siz <b>' + savedCount() + '</b> ta so\'z va ibora saqladingiz. Ularni katalogda takrorlang.</p>'
    + '<div class="row-b"><button class="btn primary" data-act="catalog">So\'zlar katalogi</button><button class="btn" data-act="restart">Qaytadan o\'ynash</button></div></div></div>');
}
function restart() {
  S.chapter = 1; S.hearts = 3; S.mistakes = 0; setCap(false);
  player.pos.set(0, 0, 32); player.rot = Math.PI; camYaw = 0; S.started = false;
  slideI = 0; showSlide();
}
function nextChapter() {
  if (S.chapter >= CHAPTERS.length) { S.chapter = CHAPTERS.length + 1; showEnd(); return; }
  S.chapter++; S.hearts = 3; S.mistakes = 0; S.mode = 'play'; hideOv(); renderHud();
}

/* ---- Katalog va Practice pack ---- */
let catBack = null, catTab = 'words';
const PK = { fc: 0, flip: false, q: 0, score: 0, items: null, answered: false };
function openCatalog(back) { catBack = back; S.mode = 'catalog'; catTab = 'words'; renderCatalog(); }
function closeCatalog() { const b = catBack; catBack = null; if (b) b(); }
const GROUPS = [[1, 'Qism 1. Ovqat topish'], [2, 'Qism 2. Ish topish'], [3, 'Qism 3. Tunash joyi'], [4, "Qism 4. Yo'qolgan qalpoqcha"], [0, 'Boshqa suhbatlar']];
function wordItem(k) {
  const e = LEX[k];
  return '<div class="wi"><b>' + esc(k) + '</b><span class="u">' + esc(e.uz) + '</span><div class="g">' + esc(e.g) + '</div><div class="e">' + esc(e.ex) + '</div><button class="rm" data-act="rm" data-k="' + esc(k) + '" aria-label="Olib tashlash">&times;</button></div>';
}
function renderCatalog() {
  const ks = Object.keys(S.saved).filter(k => LEX[k]);
  let body = '';
  if (catTab === 'words') {
    if (!ks.length) body = '<div class="lock"><h3>Katalog hozircha bo\'sh</h3><p>Suhbat paytida sariq chiziqli so\'zlar ustiga bosing va "So\'zni saqlash" tugmasini bosing.</p></div>';
    else body = GROUPS.map(g => { const arr = ks.filter(k => (S.saved[k].ch || 0) === g[0]); return arr.length ? '<div class="sub">' + g[1] + ' (' + arr.length + ')</div><div class="wl">' + arr.map(wordItem).join('') + '</div>' : ''; }).join('');
  } else body = renderPack(ks);
  showOv('<div class="scr"><div class="card cat"><div class="row-b" style="justify-content:space-between;margin:0"><h2 style="margin:0">So\'zlar katalogi</h2><button class="btn sm dark" data-act="closecat">Yopish</button></div>'
    + '<p class="note" style="margin-top:4px">Saqlangan so\'zlar: ' + ks.length + '</p>'
    + '<div class="tabs"><button class="tab' + (catTab === 'words' ? ' on' : '') + '" data-act="tab" data-t="words">So\'zlar</button><button class="tab' + (catTab === 'pack' ? ' on' : '') + '" data-act="tab" data-t="pack">Practice pack</button></div>' + body + '</div></div>');
}
function renderPack(ks) {
  if (!S.hasPack) return '<div class="lock"><h3>Practice pack yopiq</h3><p>Saqlagan so\'zlaringizdan tayyor mashq to\'plami: flashcard va bo\'sh joyni to\'ldirish testi, hammasi bir joyda.</p>'
    + (DEMO ? '<button class="btn primary" data-act="buypack">Practice packni sotib olish (demo)</button><p class="note">Bu demo: tugma paketni sinash uchun ochadi. Haqiqiy sotuv Lexora do\'konida.</p>'
      : '<button class="btn primary" data-act="buyshop">Lexora do\'konidan olish</button><p class="note">Practice pack Lexora do\'konida sotiladi. Sotib olingach, bu yerda avtomatik ochiladi.</p>') + '</div>';
  if (ks.length < 2) return '<div class="lock"><h3>Practice pack tayyor</h3><p>Mashq tuzish uchun kamida 2 ta so\'z saqlang.</p></div>';
  PK.fc = clamp(PK.fc, 0, ks.length - 1);
  const k = ks[PK.fc], e = LEX[k];
  let html = '<div class="sub">1. Flashcard (' + (PK.fc + 1) + ' / ' + ks.length + ')</div><div class="fc"><div class="fc-card" data-act="flip">'
    + (PK.flip ? esc(e.uz) + '<small>' + esc(e.g) + '</small><em>' + esc(e.ex) + '</em>' : esc(k) + '<small>Javobni ko\'rish uchun bosing</small>') + '</div></div>'
    + '<div class="row-b"><button class="btn sm" data-act="fcp">Oldingi</button><button class="btn sm" data-act="fcn">Keyingi</button><button class="btn sm" data-act="fcs">Tinglash</button></div>';
  if (!PK.items) PK.items = buildQuiz(ks);
  html += '<div class="sub" style="margin-top:18px">2. Bo\'sh joyni to\'ldiring</div>';
  if (PK.q >= PK.items.length) html += '<p class="qs">Natija: ' + PK.score + ' / ' + PK.items.length + '</p><button class="btn sm dark" data-act="qre">Qaytadan</button>';
  else {
    const it = PK.items[PK.q];
    html += '<p class="qs">' + esc(it.sentence) + '</p><div class="note" style="margin:-6px 0 10px">Ma\'nosi: ' + esc(it.uz) + '</div><div class="opts">' + it.opts.map(o => '<button class="opt" data-act="gf" data-v="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div><div class="note">' + (PK.q + 1) + ' / ' + PK.items.length + '</div>';
  }
  html += '<div class="sub" style="margin-top:18px">3. Nusxa</div><button class="btn sm dark" data-act="copy">Hamma so\'zlarni nusxalash</button><span class="note" id="cpmsg"></span>';
  return html;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildQuiz(ks) {
  const all = Object.keys(LEX);
  return shuffle(ks).slice(0, 8).map(k => {
    const re = new RegExp('\\b' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
    const pool = shuffle(ks.filter(x => x !== k).concat(shuffle(all.filter(x => x !== k && !ks.includes(x))))).slice(0, 2);
    return { k, sentence: LEX[k].ex.replace(re, '_____'), uz: LEX[k].uz, opts: shuffle([k].concat(pool)) };
  });
}
ov.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, ks = Object.keys(S.saved).filter(k => LEX[k]);
  if (a === 'start') { slideI = 0; showSlide(); }
  else if (a === 'next') { if (slideI < SLIDES.length - 1) { slideI++; showSlide(); } else beginPlay(); }
  else if (a === 'catalog') { const m = S.mode; openCatalog(() => { if (m === 'title') showTitle(); else if (m === 'summary') completeChapter(); else if (m === 'end') showEnd(); else { hideOv(); S.mode = 'play'; } }); }
  else if (a === 'closecat') closeCatalog();
  else if (a === 'tab') { catTab = t.dataset.t; renderCatalog(); }
  else if (a === 'rm') { toggleSave(t.dataset.k, 0); renderCatalog(); }
  else if (a === 'addw') { toggleSave(t.dataset.k, S.chapter); completeChapter(); }
  else if (a === 'addall') { chapterKeys(S.chapter).forEach(k => { if (!S.saved[k]) S.saved[k] = { ch: S.chapter }; }); persist(); $('#wCount').textContent = savedCount(); completeChapter(); }
  else if (a === 'nextch') nextChapter();
  else if (a === 'restart') restart();
  else if (a === 'buyshop') { if (EMBED && window.parent !== window) window.parent.postMessage({ type: 'hj-buy' }, location.origin); else location.href = '../'; }
  else if (a === 'buypack') { S.hasPack = true; persist(); PK.items = null; renderCatalog(); toast("Demo: Practice pack ochildi"); }
  else if (a === 'flip') { PK.flip = !PK.flip; renderCatalog(); }
  else if (a === 'fcn') { PK.fc = (PK.fc + 1) % ks.length; PK.flip = false; renderCatalog(); }
  else if (a === 'fcp') { PK.fc = (PK.fc - 1 + ks.length) % ks.length; PK.flip = false; renderCatalog(); }
  else if (a === 'fcs') speak(ks[PK.fc]);
  else if (a === 'qre') { PK.items = null; PK.q = 0; PK.score = 0; renderCatalog(); }
  else if (a === 'gf') {
    if (PK.answered) return; PK.answered = true;
    const it = PK.items[PK.q], ok = t.dataset.v === it.k; if (ok) PK.score++;
    ov.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b.dataset.v === it.k) b.classList.add('good'); else if (b === t) b.classList.add('bad'); });
    setTimeout(() => { PK.q++; PK.answered = false; if (catTab === 'pack' && S.mode === 'catalog') renderCatalog(); }, 900);
  }
  else if (a === 'copy') {
    const txt = ks.map(k => k + ' - ' + LEX[k].uz + '\n   ' + LEX[k].ex).join('\n');
    const msg = $('#cpmsg');
    try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = ' Nusxalandi.'; }, () => { msg.textContent = ' Nusxalab bo\'lmadi.'; }); } catch (x) { msg.textContent = ' Nusxalab bo\'lmadi.'; }
  }
});

/* ================= BOSHLASH ================= */
window.addEventListener('message', e => {
  if (e.origin !== location.origin) return;
  const d = e.data; if (!d || d.type !== 'lexora-user') return;
  LX = { hasPack: !!d.hasPack, uid: String(d.uid || '').replace(/[^\w-]/g, '').slice(0, 64) };
  S.saved = store.get(SKEY(), {}); loadProg(); S.hasPack = LX.hasPack; $('#wCount').textContent = savedCount();
  if (S.mode === 'catalog') renderCatalog(); else if (S.mode === 'title') showTitle();
});
if (EMBED && window.parent !== window) { try { window.parent.postMessage({ type: 'hj-ready' }, location.origin); } catch (e) {} }
const hot = window.claude && window.claude.hot;
function start(d) {
  d = d || {};
  if (d.saved) S.saved = Object.assign({}, S.saved, d.saved);
  if (typeof d.hasPack === 'boolean') S.hasPack = S.hasPack || d.hasPack;
  renderHearts();
  if (d.started && d.chapter) { S.chapter = d.chapter; if (S.chapter > CHAPTERS.length) { S.chapter = CHAPTERS.length; } beginPlay(); }
  else showTitle();
}
if (hot && hot.snapshot) hot.snapshot(() => ({ saved: S.saved, hasPack: S.hasPack, chapter: S.chapter, started: S.started && S.chapter <= CHAPTERS.length }));
frame();
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
window.__game = { S, player, NPC };
})();

</script>
