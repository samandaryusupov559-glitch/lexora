${String(notes).trim()}
=== END OF NOTES ===

Turn these notes into practice material for my student. Rules:
1. VOCABULARY: take ONLY the words and phrases I taught in the notes (lines like "word – translation", and new words I clearly explained). Never add words that are not in my notes. Keep my order. Skip whole sentences, task instructions and headings. Write each item in its dictionary form, with the correct spelling.
2. MEANING: if I gave a translation, it shows which meaning I taught (e.g. "bear – tug'moq" is the verb, not the animal). Use that meaning, but correct my translation if it is wrong.
3. GRAMMAR: find every grammar point I taught (rules, patterns, "how to say…" explanations). For each one write a short, clear explanation a ${level} learner understands, in simple English, and the same explanation in Uzbek (Latin script). Use only correct examples.

"grammar":[{"t":"Grammar point","rule":"Simple explanation in English.","uz":"Shu tushuntirish o'zbek tilida.","ex":["Correct example."],
  "qs":[{"q":"Question?","o":["option 1","option 2","option 3"],"a":0,"why":"Short reason."}],
  "gaps":[{"s":"I ___ born in 2004.","a":"was"}],

</style></head><body><div class="wrap"><div id="app"></div>${embedded?'':'<div class="foot">Lexora · practice page</div>'}</div>
<script>
const D=${data}, W=D.words, G=D.grammar||[];
const $=s=>document.querySelector(s), app=$('#app');
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const nz=s=>String(s||'').toLowerCase().replace(/[’‘\`]/g,"'").replace(/[.!?,;:]+$/,'').replace(/\\s+/g,' ').trim();
const say=t=>{try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u);}catch(e){}};
const send=(act,s,n)=>{ if(D.embedded) try{ parent.postMessage({lexora:'score',id:D.id,act,s,n},'*'); }catch(e){} };
const fit=()=>{ if(D.embedded) try{ parent.postMessage({lexora:'h',id:D.id,h:document.documentElement.scrollHeight},'*'); }catch(e){} };
new ResizeObserver(fit).observe(document.body);
// a sentence with the word hidden, if the example really contains it
const hide=x=>{ if(!x.ex) return null; const re=new RegExp('(^|[^A-Za-z])('+x.w.replace(/[.*+?^\${}()|[\\]\\\\]/g,'\\\\$&')+')(?![A-Za-z])','i'); const m=x.ex.match(re); if(!m) return null;
  return E(x.ex.slice(0,m.index+m[1].length))+'<span class="gap">____</span>'+E(x.ex.slice(m.index+m[1].length+m[2].length)); };
const others=(x,k,n)=>sh(W.filter(y=>y!==x&&nz(y[k])!==nz(x[k]))).slice(0,n).map(y=>y[k]);
const TABS=[...(G.length?[['grammar','📘 Grammar']]:[]),...(W.length?[['learn','📖 Words'],['cards','🃏 Flashcards'],['quiz','✅ Quiz']]:[]),...(G.some(g=>g.qs.length||g.gaps.length)?[['gquiz','🧠 Grammar quiz']]:[]),
  ...(W.length||G.some(g=>g.gaps.length)?[['test','📝 Test']]:[]),...(W.length>=2?[['match','🧩 Match']]:[]),...(W.length?[['spell','🔤 Spelling']]:[]),...(G.some(g=>g.order.length)?[['order','🔀 Word order']]:[])];
let tab=W.length?'cards':'grammar', st={};
function shell(inner){ app.innerHTML=\`<h1>\${E(D.title)}</h1><p class="sub">\${[W.length?W.length+' words':'',G.length?G.length+' grammar '+(G.length>1?'points':'point'):'',D.level].filter(Boolean).map(E).join(' · ')}</p>
  <div class="tabs">\${TABS.map(([k,n])=>\`<button data-t="\${k}" aria-pressed="\${k===tab}">\${n}</button>\`).join('')}</div>\${inner}\`; fit(); }
app.addEventListener('click',e=>{ const b=e.target.closest('[data-t]'); if(b){ tab=b.dataset.t; st={}; go(); } });
function go(){ if(!TABS.length){ shell('<div class="card">No words yet.</div>'); return; } if(!TABS.some(t=>t[0]===tab)) tab=TABS[0][0]; ({grammar,learn,cards,quiz,gquiz,test,match,spell,order})[tab](); }
function result(act,s,n,rev,again){ const p=n?Math.round(s/n*100):0; send(act,s,n);
  shell(\`<div class="card res"><div class="ring" style="--p:\${p}"><b>\${p}%</b></div><h2 style="margin:0 0 4px">\${p>=90?'Excellent!':p>=70?'Good job!':p>=50?'Not bad, keep going!':'Keep practising!'}</h2><p class="mut">\${s} of \${n} right</p>
    <div class="row c"><button class="btn p" id="again">Try again</button></div>\${rev?'<ol class="rev">'+rev+'</ol>':''}</div>\`); $('#again').onclick=again; }
/* list */
function learn(){ shell(\`<div class="list">\${W.map((x,i)=>\`<div><div class="row" style="justify-content:space-between"><b>\${E(x.w)}</b><button class="btn" data-say="\${i}" style="padding:6px 10px">🔊</button></div><div>\${E(x.m)}\${x.uz?' · <span class="uz">'+E(x.uz)+'</span>':''}</div>\${x.ex?'<div class="mut"><i>'+E(x.ex)+'</i></div>':''}</div>\`).join('')}</div>\`);
  app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{const x=W[+b.dataset.say];say(x.w+(x.ex?'. '+x.ex:''));}); }
/* flashcards: cards you miss come back */
function cards(){ if(!st.q){ st={q:sh(W.map((x,i)=>i)),ok:0,again:0,fl:false}; }
  if(!st.q.length){ shell(\`<div class="card res"><h2>🎉 You went through every card!</h2><p class="mut">Knew: \${st.ok} · Again: \${st.again}</p><button class="btn p" id="again">Start again</button></div>\`); $('#again').onclick=()=>{st={};cards();}; return; }
  const x=W[st.q[0]], done=W.length-new Set(st.q).size;
  shell(\`<div class="bar"><i style="width:\${done/W.length*100}%"></i></div><button class="fc \${st.fl?'on':''}" id="fc"><span class="fi"><span class="ff f1"><b>\${E(x.w)}</b><small>tap to turn</small></span><span class="ff f2"><b>\${E(x.m)}</b>\${x.uz?'<span class="uz">'+E(x.uz)+'</span>':''}\${x.ex?'<em>“'+E(x.ex)+'”</em>':''}</span></span></button>
    <div class="row c">\${st.fl?'<button class="btn" id="no">↺ Again</button><button class="btn r" id="yes">✓ I knew it</button>':'<button class="btn p" id="flip">Show the answer</button>'}<button class="btn" id="say">🔊</button></div>\`);
  const flip=()=>{st.fl=!st.fl;cards();}; $('#fc').onclick=flip; if($('#flip'))$('#flip').onclick=flip; $('#say').onclick=()=>say(x.w);
  if($('#yes')) $('#yes').onclick=()=>{st.q.shift();st.ok++;st.fl=false;cards();};
  if($('#no')) $('#no').onclick=()=>{const i=st.q.shift();st.q.splice(Math.min(st.q.length,3),0,i);st.again++;st.fl=false;cards();}; }
/* quiz: one question at a time, answer straight away */
function mkQuiz(){ const qs=sh(W).map((x,i)=>{ const t=i%3, g=hide(x), o2=others(x,'w',3);
  if(t===1 && o2.length>=1) return {q:'Which word means: <i>'+E(x.m)+'</i>?', o:sh([x.w,...o2]), a:x.w};
  if(t===2 && g && o2.length>=1) return {q:g, o:sh([x.w,...o2]), a:x.w};
  const o1=others(x,'m',3); return o1.length ? {q:'What does <b>'+E(x.w)+'</b> mean?', o:sh([x.m,...o1]), a:x.m} : {q:'Which word means: <i>'+E(x.m)+'</i>?', o:[x.w], a:x.w}; });
  return qs.slice(0,Math.min(qs.length,15)); }
function quiz(){ if(!st.qs){ st={qs:mkQuiz(),i:0,ok:0,picks:[]}; } const Q=st, n=Q.qs.length;
  if(Q.i>=n){ return result('quiz',Q.ok,n,Q.qs.map((q,i)=>\`<li class="\${Q.picks[i]===q.a?'g':'x'}">\${q.q} → <b>\${E(q.a)}</b></li>\`).join(''),()=>{st={};quiz();}); }
  const q=Q.qs[Q.i], p=Q.picks[Q.i];
  shell(\`<p class="mut">Question \${Q.i+1} of \${n}</p><div class="bar"><i style="width:\${Q.i/n*100}%"></i></div><div class="card"><p class="q">\${q.q}</p>
    \${q.o.map(o=>\`<button class="opt \${p!=null?(o===q.a?'ok':(o===p?'no':'')):''}" data-o="\${E(o)}" \${p!=null?'disabled':''}>\${E(o)}</button>\`).join('')}
    \${p!=null?\`<div class="fb \${p===q.a?'ok':'no'}">\${p===q.a?'Right!':'Not quite. The answer is <b>'+E(q.a)+'</b>.'}</div><button class="btn p" id="nx">\${Q.i+1<n?'Next →':'See my score'}</button>\`:''}</div>\`);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const v=b.textContent; Q.picks[Q.i]=v; if(v===q.a)Q.ok++; quiz(); });
  if($('#nx')) $('#nx').onclick=()=>{Q.i++;quiz();}; }
/* test: everything at once, typed answers, with a timer */
function test(){ if(!st.qs){ const gq=sh(G.flatMap(g=>g.gaps)).slice(0,W.length?8:20).map(x=>({q:gapHTML(x.s), hint:'', a:x.a}));
    const qs=sh([...sh(W).slice(0,20-gq.length).map(x=>{ const g=hide(x); return g?{q:g, hint:x.m, a:x.w}:{q:'Write the word that means: <i>'+E(x.m)+'</i>', hint:'', a:x.w}; }), ...gq]);
    st={qs, ans:{}, start:0, mins:Math.max(3,Math.ceil(qs.length*0.6))}; }
  const T=st, n=T.qs.length;
  if(!T.start){ shell(\`<div class="card res"><h2 style="margin-top:0">📝 \${n} questions</h2><p class="mut">Type the missing word. You have \${T.mins} minutes.</p><button class="btn r" id="go">Start the test</button></div>\`); $('#go').onclick=()=>{T.start=Date.now();T.end=T.start+T.mins*60000;test();}; return; }
  if(T.done){ const ok=T.qs.filter((q,i)=>nz(T.ans[i])===nz(q.a)).length;
    return result('test',ok,n,T.qs.map((q,i)=>{const r=nz(T.ans[i])===nz(q.a);return \`<li class="\${r?'g':'x'}">\${q.q}<br>\${r?'✓':'✗'} \${E(T.ans[i]||'—')}\${r?'':' → <b>'+E(q.a)+'</b>'}</li>\`;}).join(''),()=>{st={};test();}); }
  shell(\`<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="mut">Type the missing word</span><span class="timer" id="tm"></span></div>
    <ol class="tl">\${T.qs.map((q,i)=>\`<li class="card"><p class="q" style="font-size:18px">\${q.q}</p>\${q.hint?'<p class="mut" style="margin:-8px 0 8px">Meaning: '+E(q.hint)+'</p>':''}<input class="t" data-i="\${i}" value="\${E(T.ans[i]||'')}" autocomplete="off" autocapitalize="off" spellcheck="false"></li>\`).join('')}</ol>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn r" id="fin">Finish the test</button></div>\`);
  app.querySelectorAll('input.t').forEach(inp=>{ inp.oninput=()=>{T.ans[+inp.dataset.i]=inp.value;}; inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); const nx=app.querySelector('input.t[data-i="'+(+inp.dataset.i+1)+'"]'); if(nx) nx.focus(); } }; });
  const fin=()=>{ clearInterval(T.iv); T.done=true; test(); window.scrollTo(0,0); };
  $('#fin').onclick=()=>{ const left=T.qs.filter((q,i)=>!nz(T.ans[i])).length; if(left && !T.sure){ T.sure=1; $('#fin').textContent=left+' without an answer. Finish anyway?'; return; } fin(); };
  clearInterval(T.iv); const tick=()=>{ const l=T.end-Date.now(), el=$('#tm'); if(!el) return clearInterval(T.iv); if(l<=0) return fin(); const s=Math.ceil(l/1000); el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); el.classList.toggle('late',l<60000); };
  tick(); T.iv=setInterval(tick,1000); }
/* game 1: match words and meanings, six at a time */
function match(){ if(!st.all){ st={all:sh(W), r:0, ok:0, miss:0, t0:Date.now()}; }
  const M=st, round=M.all.slice(M.r*6, M.r*6+6);
  if(!round.length){ const s=Math.round((Date.now()-M.t0)/1000); return result('match',Math.max(0,W.length-M.miss),W.length,'<li>Time: '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' · mistakes: '+M.miss+'</li>',()=>{st={};match();}); }
  if(!M.tiles){ M.tiles=sh([...round.map((x,i)=>({k:i,t:x.w,s:'w'})),...round.map((x,i)=>({k:i,t:x.m,s:'m'}))]); M.left=round.length; M.sel=null; }
  shell(\`<p class="mut">Tap a word, then its meaning. Round \${M.r+1} of \${Math.ceil(W.length/6)} · mistakes: \${M.miss}</p><div class="mg">\${M.tiles.map((x,i)=>\`<button class="tile \${x.done?'done':''} \${M.sel===i?'sel':''}" data-i="\${i}">\${E(x.t)}</button>\`).join('')}</div>\`);
  app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i, x=M.tiles[i]; if(x.done) return;
    if(M.sel==null || M.tiles[M.sel].s===x.s){ M.sel=i; return match(); }
    const y=M.tiles[M.sel]; if(y.k===x.k){ x.done=y.done=true; M.sel=null; M.left--; if(!M.left){ M.r++; M.tiles=null; } match(); }
    else { M.miss++; M.sel=null; match(); const t=app.querySelector('.tile[data-i="'+i+'"]'); if(t) t.classList.add('bad'); } }); }
/* game 2: spell the word from its letters */
function spell(){ if(!st.q){ st={q:sh(W).slice(0,15), i:0, ok:0, pick:[], wrong:false}; } const P=st, n=P.q.length;
  if(P.i>=n) return result('spell',P.ok,n,'',()=>{st={};spell();});
  const x=P.q[P.i], letters=P.letters||(P.letters=sh([...x.w].map((c,j)=>({c,j}))));
  const built=P.pick.map(j=>letters[j].c).join('');
  shell(\`<p class="mut">Word \${P.i+1} of \${n}</p><div class="bar"><i style="width:\${P.i/n*100}%"></i></div><div class="card"><p class="q">\${E(x.m)}</p>\${x.uz?'<p class="mut" style="margin-top:-8px">'+E(x.uz)+'</p>':''}
    <div class="ans">\${P.pick.map((j,k)=>\`<button class="lt \${letters[j].c===' '?'sp':''}" data-u="\${k}">\${E(letters[j].c)}</button>\`).join('')}</div>
    <div class="row">\${letters.map((l,j)=>P.pick.includes(j)?'':\`<button class="lt \${l.c===' '?'sp':''}" data-j="\${j}">\${E(l.c===' '?'␣':l.c)}</button>\`).join('')}</div>
    \${P.wrong?'<div class="fb no">Not quite. It is <b>'+E(x.w)+'</b>.</div>':''}
    <div class="row" style="margin-top:12px">\${P.wrong?'<button class="btn p" id="nx">Next →</button>':'<button class="btn" id="hint">Hint</button><button class="btn" id="say">🔊</button><button class="btn" id="skip">Skip</button>'}</div></div>\`);
  const next=()=>{P.i++;P.pick=[];P.letters=null;P.wrong=false;P.hinted=false;spell();};
  app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{ P.pick.push(+b.dataset.j); const w=P.pick.map(j=>letters[j].c).join('');
    if(w.length===x.w.length){ if(nz(w)===nz(x.w)){ if(!P.hinted)P.ok++; say(x.w); return next(); } P.wrong=true; } spell(); });
  app.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{ P.pick.splice(+b.dataset.u); spell(); });
  if($('#nx')) $('#nx').onclick=next;
  if($('#skip')) $('#skip').onclick=()=>{P.wrong=true;spell();};
  if($('#say')) $('#say').onclick=()=>say(x.w);
  if($('#hint')) $('#hint').onclick=()=>{ P.hinted=true; const k=P.pick.length; if(k>=x.w.length) return; const j=letters.findIndex((l,jj)=>!P.pick.includes(jj)&&l.c.toLowerCase()===x.w[k].toLowerCase()); if(j>=0)P.pick.push(j); spell(); }; }
/* grammar: the rules from the lesson */
function gapHTML(s){ return E(s).split(/_{2,}/).join('<span class="gap">____</span>'); }
function grammar(){ shell(G.map((g,i)=>\`<div class="card gr"><h2>\${E(g.t)}</h2>\${g.rule?'<p>'+E(g.rule)+'</p>':''}\${g.uz?'<p class="uzx">'+E(g.uz)+'</p>':''}
    \${g.ex.length?'<ul class="grx">'+g.ex.map((x,j)=>'<li><button class="btn" data-gx="'+i+'.'+j+'" style="padding:6px 10px">🔊</button><span>'+E(x)+'</span></li>').join('')+'</ul>':''}</div>\`).join(''));
  app.querySelectorAll('[data-gx]').forEach(b=>b.onclick=()=>{ const [i,j]=b.dataset.gx.split('.'); say(G[+i].ex[+j]); }); }
/* grammar quiz: choices and gaps, one at a time */
function gquiz(){ if(!st.qs){ st={qs:sh([...G.flatMap(g=>g.qs.map(q=>({q:E(q.q), o:sh(q.o), a:q.o[q.a], why:q.why}))), ...G.flatMap(g=>g.gaps.map(x=>({q:gapHTML(x.s), a:x.a})))]).slice(0,20), i:0, ok:0, picks:[]}; }
  const Q=st, n=Q.qs.length;
  if(Q.i>=n) return result('gquiz',Q.ok,n,Q.qs.map((q,i)=>\`<li class="\${nz(Q.picks[i])===nz(q.a)?'g':'x'}">\${q.q} → <b>\${E(q.a)}</b></li>\`).join(''),()=>{st={};gquiz();});
  const q=Q.qs[Q.i], p=Q.picks[Q.i], done=p!=null, ok=done&&nz(p)===nz(q.a);
  shell(\`<p class="mut">Question \${Q.i+1} of \${n}</p><div class="bar"><i style="width:\${Q.i/n*100}%"></i></div><div class="card"><p class="q">\${q.q}</p>
    \${q.o?q.o.map(o=>\`<button class="opt \${done?(o===q.a?'ok':(o===p?'no':'')):''}" \${done?'disabled':''}>\${E(o)}</button>\`).join('')
      :\`<div class="row"><input class="t" id="gin" style="flex:1" value="\${done?E(p):''}" \${done?'disabled':''} autocomplete="off" autocapitalize="off" spellcheck="false">\${done?'':'<button class="btn p" id="gck">Check</button>'}</div>\`}
    \${done?\`<div class="fb \${ok?'ok':'no'}">\${ok?'Right!':'Not quite. The answer is <b>'+E(q.a)+'</b>.'}\${q.why?'<br>'+E(q.why):''}</div><button class="btn p" id="nx">\${Q.i+1<n?'Next →':'See my score'}</button>\`:''}</div>\`);
  const pick=v=>{ Q.picks[Q.i]=v; if(nz(v)===nz(q.a)) Q.ok++; gquiz(); };
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b.textContent));

/* ---------------- email to students (sent from the teacher's own Gmail) ----------------
   contacts/{uid}: {email, lang, off} written by the student (email must be their sign-in email).
   private/mail:   {url, secret, on:{...}} teacher only. url = the teacher's Google Apps Script web app,
                   which checks the secret and sends with GmailApp, BCC to the students. */
const MAIL_EVENTS = ['ann','post','task','prompt','review','pay','book','order','news','live'];
const SCRIPT_SRC = secret => `// Lexora email script, version 6: each student gets their own email from your Gmail,
// readers of the daily newspaper get a note every morning when their paper comes out,
// booked lessons get a Google Meet link (an event in your Google Calendar),
// and teachers can upload library files (saved to a "Lexora library" folder in your Google Drive).
// 1) Paste all of this into a new project at https://script.google.com
// 2) Deploy > New deployment > Web app. Execute as: Me. Who has access: Anyone.
// 3) Copy the Web app URL into Lexora > Noticeboard > Email.
const SECRET = '${secret}';

function doPost(e) {
  try {
    const d = JSON.parse(e.postData.contents);
    if (d.action === 'upload' || d.action === 'upsession' || d.action === 'upshare') {
      if (!d.key || d.key !== uploadKey()) return out({ ok: false, v: 6, error: 'wrong key' });
      return out(d.action === 'upload' ? saveFile(d) : d.action === 'upsession' ? upSession(d) : shareFile(d));
    }
    if (d.secret !== SECRET) return out({ ok: false, error: 'wrong secret' });
    if (d.action === 'news') return out(saveNews(d));
    if (d.action === 'meet') return out(makeMeet(d));
    if (d.test && !(d.to || d.bcc || []).length) { let timer = true; try { ensureTrigger(); } catch (err) { timer = false; } return out({ ok: true, v: 6, timer: timer, left: MailApp.getRemainingDailyQuota() }); }
    const ok = x => /^[^@\\s,;<>]+@[^@\\s,;<>]+\\.[^@\\s,;<>]+$/.test(x);
    const list = (d.to || d.bcc || []).filter(ok).slice(0, 50);
    if (!list.length) return out({ ok: false, v: 6, error: 'no recipients' });
    const subject = String(d.subject || '').slice(0, 200), text = String(d.text || '').slice(0, 10000);
    const opts = { htmlBody: String(d.html || '').slice(0, 30000), name: String(d.from || 'Lexora').slice(0, 60) };
    let sent = 0;
    list.forEach(to => { GmailApp.sendEmail(to, subject, text, opts); sent++; });  // each student gets their own email
    return out({ ok: true, v: 6, sent: sent, left: MailApp.getRemainingDailyQuota() });
  } catch (err) {
    return out({ ok: false, error: String(err) });
  }
}
function out(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
// Library uploads: teachers use a key made from the secret, so the secret itself stays with you.
function uploadKey() {
  return Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, SECRET + ':upload')
    .map(function (b) { return ('0' + (b & 255).toString(16)).slice(-2); }).join('');
}
function libFolder() {
  const it = DriveApp.getFoldersByName('Lexora library');
  return it.hasNext() ? it.next() : DriveApp.createFolder('Lexora library');
}
// Big files: the browser sends the file straight to Google Drive in parts; the script only opens the upload.
function upSession(d) {
  const res = UrlFetchApp.fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable', {
    method: 'post', contentType: 'application/json; charset=UTF-8', muteHttpExceptions: true,
    headers: { Authorization: 'Bearer ' + ScriptApp.getOAuthToken(), 'X-Upload-Content-Type': String(d.mime || 'application/octet-stream'),
      'X-Upload-Content-Length': String(d.size || 0), Origin: String(d.origin || '') },
    payload: JSON.stringify({ name: String(d.name || 'file').slice(0, 150), parents: [libFolder().getId()] }) });
  const h = res.getHeaders(), loc = h.Location || h.location;
  return loc ? { ok: true, v: 6, url: loc } : { ok: false, v: 6, error: res.getContentText().slice(0, 300) };
}
function shareFile(d) {
  const f = DriveApp.getFileById(String(d.id || ''));
  const p = f.getParents(); if (!p.hasNext() || p.next().getName() !== 'Lexora library') return { ok: false, v: 6, error: 'not a library file' };
  f.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
  return { ok: true, v: 6, id: f.getId(), url: 'https://drive.google.com/file/d/' + f.getId() + '/view' };
}
function saveFile(d) {
  if (!d.data || d.data.length > 45000000) return { ok: false, v: 6, error: 'file too big' };
  const folder = libFolder();
  const blob = Utilities.newBlob(Utilities.base64Decode(d.data), String(d.mime || 'application/octet-stream'), String(d.name || 'file').slice(0, 150));
  const f = folder.createFile(blob);
  f.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
  return { ok: true, v: 6, id: f.getId(), url: 'https://drive.google.com/file/d/' + f.getId() + '/view' };
}
function okMail(x) { return /^[^@\\s,;<>]+@[^@\\s,;<>]+\\.[^@\\s,;<>]+$/.test(x); }

// Google Meet: a Calendar event with a Meet link; the guests get Google's invitation too.
function makeMeet(d) {
  CalendarApp.getDefaultCalendar();  // asks for Calendar permission when you authorize the script
  const guests = (d.guests || []).filter(okMail).slice(0, 50).map(function (x) { return { email: x }; });
  const body = { summary: String(d.title || 'Lexora lesson').slice(0, 200), description: String(d.desc || '').slice(0, 2000),
    start: { dateTime: String(d.start) }, end: { dateTime: String(d.end) }, attendees: guests,
    conferenceData: { createRequest: { requestId: 'lx' + Date.now() + Math.floor(Math.random() * 1e6), conferenceSolutionKey: { type: 'hangoutsMeet' } } } };
  const api = 'https://www.googleapis.com/calendar/v3/calendars/primary/events', head = { Authorization: 'Bearer ' + ScriptApp.getOAuthToken() };
  let res = UrlFetchApp.fetch(api + '?conferenceDataVersion=1&sendUpdates=' + (guests.length ? 'all' : 'none'),
    { method: 'post', contentType: 'application/json', payload: JSON.stringify(body), headers: head, muteHttpExceptions: true });
  if (res.getResponseCode() >= 300) return { ok: false, v: 6, error: res.getContentText().slice(0, 300) };
  let ev = JSON.parse(res.getContentText());
  for (let i = 0; i < 5 && !ev.hangoutLink; i++) {
    Utilities.sleep(1500);
    ev = JSON.parse(UrlFetchApp.fetch(api + '/' + ev.id, { headers: head, muteHttpExceptions: true }).getContentText());
  }
  return ev.hangoutLink ? { ok: true, v: 6, url: ev.hangoutLink, id: ev.id } : { ok: false, v: 6, error: 'no Meet link yet' };
}

// Daily newspaper: Lexora sends the plan for the next days; sendNews() runs every 15 minutes
// and emails each reader once, when their issue comes out.
function saveNews(d) {
  const P = PropertiesService.getScriptProperties(), all = P.getProperties(), keep = {}, from = String(d.from || '');
  (d.items || []).slice(0, 150).forEach(function (it) {
    const key = 'news:' + String(it.id).slice(0, 60), old = all[key] ? JSON.parse(all[key]) : null;
    keep[key] = JSON.stringify({ date: String(it.date || ''), at: +it.at || 0, to: (it.to || []).filter(okMail).slice(0, 25),
      subject: String(it.subject || '').slice(0, 200), html: String(it.html || '').slice(0, 5000), text: String(it.text || '').slice(0, 1500),
      from: String(it.from || 'Lexora').slice(0, 60), sent: old ? (old.sent || []) : [] });
  });
  Object.keys(all).forEach(function (k) {
    if (k.indexOf('news:') !== 0 || k in keep) return;
    try { if (JSON.parse(all[k]).date >= from) P.deleteProperty(k); } catch (e) { P.deleteProperty(k); }
  });
  if (Object.keys(keep).length) P.setProperties(keep, false);
  try { ensureTrigger(); } catch (err) { return { ok: true, v: 6, saved: Object.keys(keep).length, timer: false }; }
  return { ok: true, v: 6, saved: Object.keys(keep).length };
}
function ensureTrigger() {
  const has = ScriptApp.getProjectTriggers().some(function (t) { return t.getHandlerFunction() === 'sendNews'; });
  if (!has) ScriptApp.newTrigger('sendNews').timeBased().everyMinutes(15).create();
}
function sendNews() {
  const P = PropertiesService.getScriptProperties(), all = P.getProperties(), now = Date.now();
  Object.keys(all).forEach(function (k) {
    if (k.indexOf('news:') !== 0) return;
    let r; try { r = JSON.parse(all[k]); } catch (e) { P.deleteProperty(k); return; }
    if (now - r.at > 8 * 864e5) { P.deleteProperty(k); return; }
    if (r.at > now || now - r.at > 2 * 864e5) return;
    const todo = r.to.filter(function (x) { return r.sent.indexOf(x) < 0; });
    if (!todo.length) return;
    todo.forEach(function (to) { try { GmailApp.sendEmail(to, r.subject, r.text, { htmlBody: r.html, name: r.from }); r.sent.push(to); } catch (e) {} });
    P.setProperty(k, JSON.stringify(r));
  });
}
`;
function withLang(lang, fn){ const o=LANG; LANG = DICT[lang] ? lang : 'en'; try{ return fn(); } finally{ LANG=o; } }
const trL = (lang, k, v) => withLang(lang, ()=>tr(k,v));

}
const mailOn = ev => !!S.mail.url && !!S.mail.secret && S.mail.on[ev]!==false;
// who: 'all' or a list of student uids
async function notify(ev, who, build){
  if(S.mode!=='teacher' || !mailOn(ev)) return;
  const uids = who==='all' ? Object.keys(S.profiles) : who;
  const byLang={};
  for(const uid of uids){ const c=S.contacts[uid]; if(!c || c.off || !c.email) continue; (byLang[c.lang||'en'] ||= []).push(c.email); }

  if(S.demo){ toast(tr('em.demo',{n:langs.reduce((a,l)=>a+byLang[l].length,0)})); return; }
  let sent=0, fail=null;
  for(const lang of langs){

      if(r.ok){ sent+=part.length; if(!(r.v>=2)) S.mailOld=true; } else fail=r.error||'error';
    }
  }
  toast(fail ? tr('em.fail') : S.mailOld ? tr('em.oldScript') : tr('em.sent',{n:sent}));
  if(S.mailOld && S.mail.v!==1){ try{ await S.db.doc('private/mail').set({url:S.mail.url, secret:S.mail.secret, on:S.mail.on||{}, v:1}); }catch(e){} }
}
// never wait for the Google script forever: give up after 40 s and say why
async function mailPost(body){
  const ac=new AbortController(), t=setTimeout(()=>ac.abort(), 40000);
  try{
    const res=await fetch(S.mail.url,{method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({...body, secret:S.mail.secret}), signal:ac.signal});
    const txt=await res.text();
    try{ return JSON.parse(txt); }catch(e){ return {ok:false, error: /authoriz|ruxsat|Sign in|accounts\.google/i.test(txt) ? 'auth' : 'notjson'}; }
  }catch(e){ return {ok:false, error: e&&e.name==='AbortError' ? 'timeout' : String(e&&e.message||e)}; }
  finally{ clearTimeout(t); }

function mailCard(){

/* ---------------- rating ----------------
   The teacher's page works out everyone's points and publishes only first names and points to
   board/rating, so students can see where they are without seeing each other's work. */
const RATE = {entry:10, word:50, task:5, band:10, lesson:15, quiz:1};
function ratingPoints(d){
  // d: {entries, words, tasks, band, lessons, bonus}
  const parts = {entries:d.entries*RATE.entry, words:Math.floor(d.words/RATE.word), tasks:d.tasks*RATE.task, band:Math.round((d.band||0)*RATE.band), lessons:d.lessons*RATE.lesson, quiz:(d.quiz||0)*RATE.quiz, bonus:d.bonus||0};
  return {...parts, total:Object.values(parts).reduce((a,b)=>a+b,0)};
}
const shortName = n => { const w=String(n||'').trim().split(/\s+/).filter(Boolean), L=(w.length>1?w[w.length-1]:'').match(/\p{L}/u); return w.length ? (L ? `${w[0]} ${L[0].toUpperCase()}.` : w[0]) : '?'; };
// works on plain data so the example class can use it too
function buildRating({profiles, feedback, plans, bookings, bstat, slots, bonus, scores}){
  const slotById=Object.fromEntries((slots||[]).map(x=>[x.id,x])), today=todayStr();
  return Object.entries(profiles).map(([uid,p])=>{
    const idx=Object.values(p.index||{}), fb=feedback[uid]||{};
    const marked=Object.entries(fb.reviews||{}).filter(([,r])=>(r.status==='reviewed'||r.status==='revise') && r.overall!=null).sort((a,b)=>(p.index?.[a[0]]?.date||'').localeCompare(p.index?.[b[0]]?.date||''));
    const done=plans[uid]?.done||{}, items=plans[uid]?.items||[];
    const lessons=(bookings[uid]?.items||[]).filter(r=>bstat[uid]?.[r.id]==='ok' && slotById[r.slotId] && slotById[r.slotId].date<=today).length;
    const sc=(scores||{})[uid]||{}, quiz=Object.values(sc.news||{}).reduce((a,day)=>a+Object.values(day||{}).reduce((x,r)=>x+(+r?.s||0),0),0)+Object.values(sc.study||{}).reduce((a,r)=>a+(+r?.best||0),0);
    const d={quiz, entries:idx.length, words:idx.reduce((a,e)=>a+(e.words||0),0), tasks:items.filter(i=>done[i.id]).length, band:marked.length?marked[marked.length-1][1].overall:0, lessons, bonus:+(bonus||{})[uid]||0};
    return {uid, name:p.name||'', ...d, pts:ratingPoints(d)};
  }).sort((a,b)=>b.pts.total-a.pts.total || a.name.localeCompare(b.name));
}
const publicRating = (rows, on, bonus) => ({on, bonus:bonus||{}, list:rows.map(r=>({uid:r.uid, name:shortName(r.name), pts:r.pts.total}))});
// Automatic writes are limited: at most once every 10 minutes per page, and never right after another device wrote.
// (Two open pages with different versions could otherwise rewrite each other's result without end.)
const SYNC_GAP = 10*60*1000, syncLast = {};
function syncAllowed(key, docAt){ const now=Date.now(); if(now-(syncLast[key]||0) < SYNC_GAP) return false; if(docAt && now-docAt < SYNC_GAP) return false; return true; }
let ratingT=null;
function ratingScheduleSync(){ clearTimeout(ratingT); ratingT=setTimeout(ratingSync, 900); }

  if(S.mode!=='teacher' || S.role==='staff' || !S.loaded.p || !S.loaded.f || S.rating===undefined) return;

  const strip = d => JSON.stringify({on:d.on!==false, bonus:d.bonus||{}, list:d.list||[]});
  if(strip(cur)===strip(want)) return;
  if(!syncAllowed('rating', cur.at)) return;
  syncLast.rating=Date.now();
  try{ await S.db.doc('board/rating').set({...want, at:Date.now()}); }catch(e){ /* old rules: shown on the Rating page */ }
}

  let out='',i=0;

    out+=`<mark class="mk ${a.kind==='sug'?'sug':''} t-${esc(a.type)} ${a.id===selId?'sel':''}" data-id="${esc(a.id)}" data-kind="${a.kind}"${fix?` data-fix="${esc(fix)}"`:''} tabindex="0">${esc(body.slice(a.start,a.end))}</mark>`; i=a.end; }

function fixOffsets(body, anns){ // keep annotations aligned if offsets drift

  const pre=document.createRange(); pre.selectNodeContents(container); pre.setEnd(r.startContainer,r.startOffset);
  let start=pre.toString().length, end=start+r.toString().length; const body=R.entry.body;
  while(start<end && /\s/.test(body[start])) start++; while(end>start && /\s/.test(body[end-1])) end--;

}

async function aiSuggest(){
  const R=S.review; if(!R) return;
  if(S.demo && !S.sample){ R.sugs = demoSuggestions(R.entry.body, R.data.annotations); renderReviewTools(); renderPaper(); if(!R.sugs.length) toast(tr('ai.none')); return; }
  R.aiBusy=true; renderReviewTools();
  const lvl=S.profiles[R.sid]?.level||'B1';
  const prompt = `You help an English teacher mark a learner's diary entry. Learner level: ${lvl} (CEFR).
Find the language errors. Return ONLY JSON in this shape:
{"suggestions":[{"quote":"exact text copied from the entry","correction":"the corrected text","type":"gr","note":"short learner-friendly explanation, max 14 words"}]}
type is one of: gr (grammar), t (tense), art (article), prep (preposition), ww (word choice), sp (spelling), p (punctuation), wo (word order), agr (agreement), st (style), good (something done well).
Rules: "quote" must be copied exactly, character for character, from the entry and be as short as possible (the wrong word or short phrase). Do not overlap quotes. List up to 25 errors, most important first, then at most 2 "good" items with an empty correction. Do not mark British vs American spelling differences.
Entry title: ${R.entry.title||''}
Entry:
"""
${R.entry.body}
"""`;
  try{
    const res = await S.sample.json(prompt,{modelTier:'default'});
    R.sugs = locateSuggestions(R.entry.body, R.data.annotations, (res&&res.suggestions)||[]);

    else toast(tr('ai.fail'));
  }

}
function locateSuggestions(body, anns, list){
  const taken=anns.filter(a=>a.start>=0).map(a=>[a.start,a.end]); const out=[];
  for(const s of list){ if(!s||typeof s.quote!=='string'||!s.quote.trim()) continue; const type=TYPE[s.type]?s.type:'gr';
    let from=0, pos=-1; while((pos=body.indexOf(s.quote,from))>=0){ const e=pos+s.quote.length; if(!taken.some(([a,b])=>a<e&&b>pos)) break; from=pos+1; }
    if(pos<0) continue; const end=pos+s.quote.length; taken.push([pos,end]);
    out.push({id:newId(),start:pos,end,quote:s.quote,type,correction:type==='good'?'':String(s.correction||''),note:String(s.note||'')}); }
  return out;
}
function demoSuggestions(body, anns){
  const ideas=[['woke up in','gr','woke up at','Use "at" with clock times.'],['in 7','prep','at 7','Use "at" with clock times.'],['a exam','art','an exam','"An" before a vowel sound.'],['I make','t','I made','The exam is finished: past simple.'],['said me','gr','told me','"Tell" takes a person; "say" does not.'],['win','t','won','Past simple: win – won.'],['was rainy day','art','was a rainy day','Singular countable noun needs "a".'],['is consisted of','gr','consists of','"Consist of" is not used in the passive.'],['it worth','gr','it was worth','"Worth" needs the verb "be".'],['in a long thin pieces','art','into long, thin pieces','No "a" with plurals; "cut into".'],['told that','gr','said that','"Tell" needs a person; use "said".'],['asked second plate','art','asked for a second plate','"Ask for" + a/an.'],['Pakhtakor win 2-1!','good','','Nice, lively ending!']];
  return locateSuggestions(body, anns, ideas.filter(([q])=>body.includes(q)).map(([quote,type,correction,note])=>({quote,type,correction,note})));
}

function tLevel(score){
  score=+score||0; let i=0; while(i<TLEVEL_STEPS.length-1 && score>=TLEVEL_STEPS[i+1]) i++;
  const next=TLEVEL_STEPS[i+1], prev=TLEVEL_STEPS[i];
  return {n:i+1, name:tr('lv.'+(i+1)), next, toNext: next!=null? next-score : 0, pct: next!=null? Math.round((score-prev)/(next-prev)*100) : 100};
}

/* ---------- course prices (business plan, Table 1): Lexora sets a range for each teacher level and lesson format,
   each teacher chooses a price inside it. Prices are per month (12 lessons).
   site/pricing (public, owner writes): {lv:{junior:{group:[lo,hi], ind:[lo,hi]}, teacher:{…}, senior:{…}}, langs:{Korean:110} (% of the range), auto:{teacher:{y,n}, senior:{y,n}}}
   Level: the owner can place a teacher (teachers/{tid}.plevel); otherwise it follows experience and students:
   Teacher from `teacher.y` years OR `teacher.n` students, Senior from `senior.y` years AND `senior.n` students.
   teachers/{tid}.prices: {English:{group, ind}} — the teacher's choice, always shown clamped to the range. */
const PLEVELS = ['junior','teacher','senior'];
const PFORMATS = ['group','ind'];
const PRICING_DEF = {lv:{junior:{group:[250000,350000], ind:[500000,650000]}, teacher:{group:[350000,450000], ind:[650000,800000]}, senior:{group:[450000,600000], ind:[800000,1000000]}},
  langs:{}, auto:{teacher:{y:3, n:10}, senior:{y:6, n:25}}};
const r1000 = v => Math.round((+v||0)/1000)*1000;
function pricing(){ const p=S.pricing||{}, lv={};
  for(const l of PLEVELS){ lv[l]={}; for(const f of PFORMATS){ const x=p.lv?.[l]?.[f]; lv[l][f]=Array.isArray(x)&&x.length===2&&+x[0]>0&&+x[1]>=+x[0] ? [+x[0],+x[1]] : PRICING_DEF.lv[l][f]; } }
  return {lv, langs:p.langs||{}, auto:{teacher:{...PRICING_DEF.auto.teacher, ...(p.auto?.teacher||{})}, senior:{...PRICING_DEF.auto.senior, ...(p.auto?.senior||{})}}}; }
function autoLevel(years, students){ const A=pricing().auto, y=+years||0, n=+students||0;
  if(y>=A.senior.y && n>=A.senior.n) return 'senior'; if(y>=A.teacher.y || n>=A.teacher.n) return 'teacher'; return 'junior'; }
const tPLevel = t => PLEVELS.includes(t?.plevel) ? t.plevel : autoLevel(t?.years, t?.stats?.students);
function priceRange(lang, fmt, level){
  const P=pricing(), [lo0,hi0]=P.lv[PLEVELS.includes(level)?level:'junior'][fmt], pct=+P.langs[lang]||100;
  return {lo:r1000(lo0*pct/100), hi:r1000(hi0*pct/100), pct, level};
}
function teacherPrice(t, lang, fmt){
  const r=priceRange(lang, fmt, tPLevel(t)), v=+t?.prices?.[lang]?.[fmt]||0;
  return {...r, own:v, v: v ? Math.min(r.hi, Math.max(r.lo, v)) : 0, out: !!v && (v<r.lo || v>r.hi)};
}

}

/* ---------- levels: computed on the owner's page (only it sees every student) and published to the profile ---------- */
function teacherStats(tid){
  const sids=Object.keys(S.profiles).filter(sid=>tidOf(S.profiles[sid])===tid), monthAgo=Date.now()-30*864e5;
  let reviews=0, gainSum=0, gains=0, bands=[], active=0;
  for(const sid of sids){
    const p=S.profiles[sid]||{}, fb=S.feedback[sid]||{};
    const marked=Object.entries(fb.reviews||{}).filter(([,r])=>(r.status==='reviewed'||r.status==='revise') && r.overall!=null)
      .sort((a,b)=>(p.index?.[a[0]]?.date||'').localeCompare(p.index?.[b[0]]?.date||''));
    reviews+=marked.length;
    if(marked.length){ bands.push(marked[marked.length-1][1].overall); }
    if(marked.length>=2){ const g=marked[marked.length-1][1].overall-marked[0][1].overall; gainSum+=Math.max(0,g); gains++; }
    if(Object.values(p.index||{}).some(e=>(e.submittedAt||0)>monthAgo)) active++;
  }
  const bonus=+(S.team[tid]?.bonus)||0;
  const extra=Object.keys(S.rosters?.[tid]?.students||{}).filter(uid=>!sids.includes(uid)).length;
  const score = expPts(S.team[tid]?.years) + (sids.length+extra)*TPTS.student + reviews*TPTS.entry + Math.round(gainSum*TPTS.gain) + bonus;
  return {students:sids.length+extra, active, reviews, gain: gains? round1(gainSum/gains) : 0, band: bands.length? round1(bands.reduce((a,b)=>a+b,0)/bands.length) : null, score: Math.max(0,score)};
}
let centreT=null;
function centreScheduleSync(){ if(S.mode!=='teacher' || S.role==='staff') return; clearTimeout(centreT); centreT=setTimeout(centreSync, 1200); }
async function centreSync(){
  if(S.mode!=='teacher' || S.role==='staff' || !S.teamLoaded || !S.loaded.p || !S.loaded.f) return;
  for(const [tid,t] of Object.entries(S.team)){
    const st=teacherStats(tid), old=t.stats||{};
    if(['students','active','reviews','gain','band','score'].every(k=>old[k]===st[k] || (Number.isNaN(old[k])&&Number.isNaN(st[k])))) continue;
    if(!syncAllowed('stats:'+tid, old.at)) continue;
    syncLast['stats:'+tid]=Date.now();
    try{ await S.db.doc('teachers/'+tid).update({stats:{...st, at:Date.now()}}); }catch(e){ return; }
  }
}

function trialQuote(lang, tid, fmt){
  fmt = PFORMATS.includes(fmt) ? fmt : 'group';
  const t = tid && S.team?.[tid], teachers = t ? [t] : teamList(false).filter(x=>(x.langs||[]).includes(lang));
  let lo, hi, len = t ? +t.lessonLen||0 : 0;

  else { lo=priceRange(lang, fmt, 'junior').lo; hi=priceRange(lang, fmt, 'senior').hi; }
  const plain = (lo===hi ? som(lo) : som(lo).replace(' '+tr('lg.som'),'')+' – '+som(hi)) + ' / ' + tr('pc.month');
  const lesson = lo===hi ? som(r1000(lo/12)) : som(r1000(lo/12)).replace(' '+tr('lg.som'),'')+' – '+som(r1000(hi/12));
  const note = t ? (teacherPrice(t,lang,fmt).v ? tr('c.qExact',{name:esc(t.name||'')}) : tr('c.qRangeT',{name:esc(t.name||'')}))
    : teachers.length ? tr('c.qRangeAny',{n:teachers.length}) : tr('c.qNoT');
  const html = `<div class="row" style="justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap"><span class="label">${tr('c.qH')} · ${esc(langName(lang))} · ${tr('pc.'+fmt)}</span></div>

  return {lo, hi, plain, html};
}

// square-crop and shrink an uploaded photo so it fits inside the profile document
function shrinkPhoto(file){
  return new Promise((ok,bad)=>{ const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{ const n=320, c=document.createElement('canvas'); c.width=c.height=n; const s=Math.min(img.width,img.height);
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,n,n); URL.revokeObjectURL(u);
      const d=c.toDataURL('image/jpeg',0.82); d.length<250000 ? ok(d) : bad(new Error('big')); };
    img.onerror=()=>{ URL.revokeObjectURL(u); bad(new Error('img')); }; img.src=u; });
}

}

function centreActivity(limit){

async function makeMeet(slot, guests){
  const start=new Date(slot.date+'T'+(slot.from||'09:00')), end=new Date(slot.date+'T'+(slot.to||slot.from||'10:00')); if(!(end>start)) end.setTime(start.getTime()+80*60000);
  if(S.demo) return {ok:true, url:'https://meet.google.com/abc-defg-hij'};
  if(!S.mail?.url || !S.mail?.secret) return {ok:false, error:'nomail'};
  const r=await mailPost({action:'meet', title:'Lexora · '+tr('c.lessonT'), desc:'', start:start.toISOString(), end:end.toISOString(), guests});
  if(!r.ok && !(r.v>=4)) return {ok:false, error:'old'};
  return r;
}

function enrollLangs(uid, st){
  const out=new Set();
  for(const tid of okTids(st)){ const l=(S.enrolls?.[uid]?.items||[]).find(i=>i.tid===tid)?.lang || S.rosters?.[tid]?.students?.[uid]?.lang; (l?[l]:tLangsOf(tid)).forEach(x=>out.add(x)); }
  return [...out].sort();
}
// older confirmations have no langs yet: the owner's page fills them in
let elT=null;
const enrollLangsSoon = () => { if(S.role!=='owner' || S.demo) return; clearTimeout(elT); elT=setTimeout(enrollLangsSync, 1500); };
async function enrollLangsSync(){
  if(S.role!=='owner' || !S.teamLoaded || !S.enrollSt || !S.rosters || !S.enrolls) return;
  for(const [uid,st] of Object.entries(S.enrollSt)){ const want=enrollLangs(uid,st); if(JSON.stringify(want)===JSON.stringify(st.langs||[])) continue;
    try{ await S.db.doc('enrollStatus/'+uid).set({langs:want},{merge:true}); }catch(e){ return; } }
}
async function setEnroll(uid, tid, st){
  const cur={...(S.enrollSt?.[uid]||{})}, ro=clone(S.rosters?.[tid]||{students:{}}); ro.students=ro.students||{};
  if(st==='off'){ delete cur[tid]; delete ro.students[uid];
    const e=S.enrolls?.[uid]; if(e) await S.db.doc('enroll/'+uid).set({...e, items:(e.items||[]).filter(i=>i.tid!==tid)}); }
  else { cur[tid]=st; if(st==='ok'){ const i=(S.enrolls?.[uid]?.items||[]).find(x=>x.tid===tid); ro.students[uid]={name:S.profiles[uid]?.name||'', lang:i?.lang||'', since:Date.now()}; } else delete ro.students[uid]; }
  cur.langs=enrollLangs(uid, cur); await S.db.doc('enrollStatus/'+uid).set(cur); await S.db.doc('roster/'+tid).set(ro);
}

/* ---------- chats ----------
   gchat/{id}: a site visitor's chat with the centre. The id is a long random secret kept in the visitor's browser.
     {name, contact, lang, tid, at, lastAt, lastBy:'g'|'t', lastText, rg, rt}   gchat/{id}/msgs/{m}: {name, text, at, by, uid?}
   dm/{uid}_{tid}: a student's chat with one of their teachers (opens once lessons have started).
     {uid, tid, name, lastAt, lastBy:'s'|'t', lastText, rs, rt}                  dm/{id}/msgs/{m}: {uid, name, text, at, by}
   lastBy/r*: who wrote last and when each side last read — that makes the unread dots. */
const chatClip = t => String(t||'').replace(/\s+/g,' ').trim().slice(0,140);
const chatTime = at => { const d=new Date(at), hm=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); return new Date().toDateString()===d.toDateString() ? hm : d.toLocaleDateString([], {day:'numeric',month:'short'})+' '+hm; };
const READ_KEY = {g:'rg', s:'rs', t:'rt'};
const unreadFor = (c, side) => !!(c && c.lastAt && c.lastBy && c.lastBy!==side && (c[READ_KEY[side]]||0) < c.lastAt);
const chatUnreadT = () => Object.values(S.dms||{}).filter(c=>unreadFor(c,'t')).length + Object.values(S.gchats||{}).filter(c=>unreadFor(c,'t')).length;
const chatUnreadS = () => Object.values(S.myDms||{}).filter(c=>unreadFor(c,'s')).length;
const chatMyName = () => (S.mode==='student' ? (S.myProfile?.name||tr('student')) : (S.team?.[myTid()]?.name || S.me?.name || tr('teacher'))).slice(0,80);
const byLast = (a,b) => (b.lastAt||0)-(a.lastAt||0);
const gchatId = () => LS.get('gchat-id','');
const secretId = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b=>b.toString(36).padStart(2,'0')).join('').slice(0,28);

// the chat on screen now: {kind:'g'|'dm', id, doc, side, tid?}
function chatCur(){
  if(S.mode==='guest'){ const id=gchatId(); return id ? {kind:'g', id, doc:S.gchat||null, side:'g'} : null; }
  if(S.view.name!=='chat') return null;
  if(S.mode==='student'){ const tid=S.view.tid; return tid ? {kind:'dm', id:S.uid+'_'+tid, doc:S.myDms?.[tid]||null, side:'s', tid} : null; }
  const k=S.view.k==='g'?'g':'dm', id=S.view.id; if(!id) return null;
  return {kind:k, id, doc:(k==='g'?S.gchats:S.dms)?.[id]||null, side:'t'};
}
function chatWatch(path){
  if(S._chPath===path) return; chatUnwatch(); if(!path) return;
  S._chPath=path; S.chMsgs={}; S.chErr=null;
  S._chUn = S.db.collection(path).onSnapshot(q=>{ const o={}; q.docs.forEach(d=>{ if(d.exists) o[d.id]=d.data(); }); S.chMsgs=o; S.chErr=null; drawChatMsgs(); },
    e=>{ S.chErr=(e&&e.code)||'error'; drawChatMsgs(); });
}
function chatUnwatch(){ if(S._chUn){ try{ S._chUn(); }catch(e){} } S._chUn=null; S._chPath=null; S.chMsgs={}; }
function chatMsgsHtml(){
  if(S.chErr) return `<div class="notice" style="margin:auto">${tr('dm.err',{code:esc(String(S.chErr))})}</div>`;
  const side=S._chSide, list=Object.entries(S.chMsgs||{}).map(([id,m])=>({id,...m})).sort((a,b)=>a.at-b.at);
  if(!list.length) return `<p class="faint club-empty">${tr('dm.empty')}</p>`;
  return list.map(m=>{ const mine = side==='t' ? (m.by==='t' && m.uid===S.uid) : m.by===side, staff=m.by==='t';
    return `<div class="cmsg ${mine?'me':''} ${staff&&!mine&&side!=='t'?'mod':''}">${mine?'':avatar(m.name||'?',m.uid||m.name)}<div class="cb"><div class="cmeta"><b>${esc(m.name||'')}</b> <span class="faint">${esc(chatTime(m.at))}</span>
      ${S.role==='owner'&&side==='t'?`<button class="cdel" data-act="c-ch-del" data-id="${esc(m.id)}" title="${tr('delete')}">×</button>`:''}</div><div class="ctext">${esc(m.text)}</div></div></div>`; }).join('');
}
function drawChatMsgs(){
  const el=$('#ch-msgs'); if(!el) return;
  const atEnd = !el.dataset.ready || el.scrollHeight-el.scrollTop-el.clientHeight<80;
  el.innerHTML=chatMsgsHtml(); el.dataset.ready='1'; if(atEnd) el.scrollTop=el.scrollHeight; chatMarkRead();
}
function chatMarkRead(){
  const c=chatCur(); if(!c || !c.doc || !unreadFor(c.doc,c.side) || !$('#ch-msgs') || document.hidden) return;
  const key=c.kind+c.id+':'+c.doc.lastAt; if(S._chRead===key) return; S._chRead=key;
  (async()=>{ try{ await S.db.doc((c.kind==='g'?'gchat/':'dm/')+c.id).update({[READ_KEY[c.side]]:Date.now()}); }catch(e){} })();
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) chatMarkRead(); });
async function chatSend(text){
  const c=chatCur(); if(!c) return; text=String(text||'').trim().slice(0,1000); if(!text) return;
  const now=Date.now(), last={lastAt:now, lastText:chatClip(text)}, base=c.kind==='g'?'gchat/':'dm/';
  if(c.side==='g'){
    await S.db.collection(base+c.id+'/msgs').doc().set({name:(c.doc?.name||tr('dm.guestTag')).slice(0,80), text, at:now, by:'g'});
    await S.db.doc(base+c.id).update({...last, lastBy:'g', rg:now});
  } else if(c.side==='s'){
    await S.db.doc(base+c.id).set({uid:S.uid, tid:c.tid, name:(S.myProfile?.name||'').slice(0,80), ...last, lastBy:'s', rs:now}, {merge:true});
    await S.db.collection(base+c.id+'/msgs').doc().set({uid:S.uid, name:chatMyName(), text, at:now, by:'s'});
  } else {
    await S.db.collection(base+c.id+'/msgs').doc().set({uid:S.uid, name:chatMyName(), text, at:now, by:'t'});
    await S.db.doc(base+c.id).update({...last, lastBy:'t', rt:now});
  }
}
function wireChatForm(){
  const f=$('#ch-form'); if(!f) return; const ta=$('#ch-text');
  ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && !matchMedia('(hover:none)').matches){ e.preventDefault(); f.requestSubmit(); } });
  f.addEventListener('submit', async e=>{ e.preventDefault(); const text=ta.value; if(!text.trim()) return; const b=f.querySelector('button'); ta.value=''; b.disabled=true;
    try{ await chatSend(text); }catch(err){ ta.value=text; toast(tr('dm.fail',{code:esc(String(err?.code||err?.message||err))}), 8000); }
    b.disabled=false; ta.focus(); });
}
const chRow = (data, name, id, sub, at, un, on) => `<button class="chrow ${on?'on':''} ${un?'un':''}" data-act="c-ch-open" ${data}>${avatar(name,id)}<span class="chrow-t"><b>${esc(name)}</b><span class="small muted">${esc(sub||'')}</span></span><span class="chrow-m">${at?`<span class="small faint">${esc(ago(at))}</span>`:''}${un?'<span class="chdot"></span>':''}</span></button>`;
const chatPane = head => `<div class="club-chat card"><div class="ch-head" id="ch-head">${head}</div><div class="club-msgs" id="ch-msgs"></div>
  <form id="ch-form" class="club-in" novalidate><textarea class="inp" id="ch-text" rows="2" maxlength="1000" placeholder="${tr('dm.ph')}"></textarea><button class="btn pen">${tr('dm.send')}</button></form></div>`;
function contactHtml(x){
  x=String(x||'').trim(); const tg=x.match(/^@([A-Za-z][\w]{3,31})$/), ph=x.replace(/[^\d+]/g,'');
  if(tg) return `<a href="https://t.me/${esc(tg[1])}" target="_blank" rel="noopener">${esc(x)}</a>`;
  if(ph.replace('+','').length>=7) return `<a href="tel:${esc(ph)}">${esc(x)}</a>`;
  return esc(x);
}

// students: one chat per teacher they have started lessons with
function chatListS(){ return myTids().map(tid=>{ const c=S.myDms?.[tid]; return chRow(`data-tid="${esc(tid)}"`, tName(tid), tid, c?.lastText || (S.team?.[tid]?.langs||[]).join(', '), c?.lastAt, unreadFor(c,'s'), tid===S.view.tid); }).join(''); }
const chatHeadS = () => `${avatar(tName(S.view.tid),S.view.tid)}<div style="min-width:0"><b>${esc(tName(S.view.tid))}</b><div class="small muted">${tr('dm.teacherK')}</div></div>`;
function vChatS(){
  const head=`<div class="page-head"><div><h1>${tr('dm.h')}</h1><p>${tr('dm.pS')}</p></div></div>`;
  if(!S.myProfile) return head+`<div class="empty"><p>${tr('dm.noTeachers')}</p></div>`;
  const tids=myTids(); if(!tids.includes(S.view.tid)) S.view.tid = tids.find(t=>unreadFor(S.myDms?.[t],'s')) || tids[0];
  return head+`<div class="club chat"><div class="card ch-list" id="ch-list">${chatListS()}</div>${chatPane(chatHeadS())}</div>`;
}
// teachers: their students' chats + visitors' chats (the owner sees all of them)
function chatThreadsT(){
  return {dms:Object.entries(S.dms||{}).map(([id,c])=>({k:'dm', id, ...c, nm:c.name||S.profiles?.[c.uid]?.name||'–'})).sort(byLast),
          gs:Object.entries(S.gchats||{}).map(([id,c])=>({k:'g', id, ...c, nm:c.name||'–'})).sort(byLast)};
}
function chatListT(){
  const {dms,gs}=chatThreadsT(), v=S.view;
  const sub = c => (S.role==='owner' && c.k==='dm' && c.tid!==MAIN_TID ? tName(c.tid)+' · ' : '') + (S.role==='owner' && c.k==='g' && !c.tid ? tr('c.anyTeacher')+' · ' : '') + (c.lastText||'');
  const rows = arr => arr.map(c=>chRow(`data-k="${c.k}" data-id="${esc(c.id)}"`, c.nm, c.uid||c.id, sub(c), c.lastAt, unreadFor(c,'t'), v.k===c.k && v.id===c.id)).join('');
  return `<h3 class="ch-sec">${tr('dm.students')}</h3>${dms.length?rows(dms):`<p class="faint small ch-none">${tr('dm.noS')}</p>`}
    <h3 class="ch-sec">${tr('dm.guests')}</h3>${gs.length?rows(gs):`<p class="faint small ch-none">${tr('dm.noG')}</p>`}`;
}
function chatHeadT(){
  const v=S.view, c=(v.k==='g'?S.gchats:S.dms)?.[v.id]; if(!c) return '';
  if(v.k!=='g'){ const nm=c.name||S.profiles?.[c.uid]?.name||'–'; return `${avatar(nm,c.uid)}<div style="min-width:0"><b>${esc(nm)}</b><div class="small muted">${tr('dm.withT',{name:esc(tName(c.tid))})}</div></div>`; }
  return `${avatar(c.name||'?',v.id)}<div style="min-width:0"><b>${esc(c.name||'–')}</b> <span class="pill">${tr('dm.guestTag')}</span>
    <div class="small muted">${contactHtml(c.contact)}${c.lang?' · '+esc(c.lang):''}${c.tid?' · '+tr('c.forT',{name:esc(tName(c.tid))}):''}</div></div>${S.role==='owner'?asgPicker('g',v.id,c):''}`;
}
function vChatT(){
  const v=S.view, head=`<div class="page-head"><div><h1>${tr('dm.h')}</h1><p>${tr('dm.pT')}</p></div></div>`;
  if(!v.id){ const {dms,gs}=chatThreadsT(), all=[...dms,...gs].sort(byLast), first=all.find(c=>unreadFor(c,'t'))||all[0]; if(first){ v.k=first.k; v.id=first.id; } }
  const c=chatCur();
  return head+`<div class="club chat"><div class="card ch-list" id="ch-list">${chatListT()}</div>${c&&c.doc?chatPane(chatHeadT()):`<div class="club-chat card"><p class="faint chat-pick">${tr('dm.pick')}</p></div>`}</div>`;
}
const vChat = () => S.mode==='student' ? vChatS() : vChatT();
after.chat = () => {
  const c=chatCur(); S._chSide = S.mode==='student'?'s':'t';
  chatWatch(c && $('#ch-msgs') ? (c.kind==='g'?'gchat/':'dm/')+c.id+'/msgs' : null); drawChatMsgs(); wireChatForm();

// live data changed: redraw the list and header, never the half-typed message
function drawChat(){
  if(S.view.name!=='chat') return;
  const l=$('#ch-list'); if(l) l.innerHTML = S.mode==='student' ? chatListS() : chatListT();
  const h=$('#ch-head'); if(h && !(h.contains(document.activeElement) && document.activeElement.tagName==='SELECT')) h.innerHTML = S.mode==='student' ? chatHeadS() : chatHeadT();
  if(S.mode==='teacher' && !h && chatCur()?.doc) renderMain();   // the chosen chat just arrived

/* visitors: "Chat with us" on the public page */

  const id=gchatId(); if(!id || S._gDocUn) return;
  S._gDocUn = S.db.doc('gchat/'+id).onSnapshot(s=>{ S.gchat = s.exists ? s.data() : null; if(!s.exists) LS.del('gchat-id'); drawGuestDots(); chatMarkRead(); }, ()=>{});
  S.unsubs.push(()=>{ if(S._gDocUn){ try{ S._gDocUn(); }catch(e){} S._gDocUn=null; } });
}
const guestDot = () => `<span class="chdot" data-gdot ${unreadFor(S.gchat,'g')?'':'hidden'}></span>`;
function drawGuestDots(){ const on=unreadFor(S.gchat,'g'); document.querySelectorAll('[data-gdot]').forEach(e=>e.hidden=!on); }

  showDlg(`<form id="gs-form" novalidate>${dlgHead(tr('dm.guestK'), tr('dm.guestH'))}
    <div class="dlg-body"><p class="muted">${tr('dm.guestP')}</p>
      <div class="grid2" style="gap:12px"><label class="field"><span>${tr('c.fName')}</span><input class="inp" id="gs-name" maxlength="80" autocomplete="name" required></label>
        <label class="field"><span>${tr('c.fContact')}</span><input class="inp" id="gs-contact" maxlength="120" placeholder="+998 90 123 45 67 / @telegram" required></label></div>
      <div class="grid2" style="gap:12px"><label class="field"><span>${tr('c.fLang')}</span><select class="inp" id="gs-lang">${langOpts(langs, pre)}</select></label>
        <label class="field"><span>${tr('c.fTeacher')}</span><select class="inp" id="gs-tid"><option value="">${tr('c.anyTeacher')}</option>${all.map(t=>`<option value="${esc(t.tid)}" ${t.tid===tid?'selected':''}>${esc(t.name||'')}</option>`).join('')}</select></label></div>

/* "any teacher" requests and visitor chats: share them fairly so teachers don't compete for them.
   The fairest teacher is visible, teaches the language, and has the fewest students + new requests (+ ones given in this round). */
function leadLoad(tid, plan){
  const monthAgo=Date.now()-30*864e5;
  return teacherStats(tid).students
    + Object.values(S.leads||{}).filter(x=>x.tid===tid && !x.st).length
    + Object.values(S.gchats||{}).filter(x=>x.tid===tid && (x.at||0)>monthAgo).length
    + (plan?.[tid]||0);
}
function pickTeacher(x, plan){
  const all=teamList(false); if(!all.length) return '';
  const lang=String(x.lang||'').trim().toLowerCase();
  const fits=all.filter(t=>(t.langs||[]).some(l=>String(l).trim().toLowerCase()===lang));
  return (fits.length?fits:all).map(t=>({tid:t.tid, n:leadLoad(t.tid,plan), name:t.name||''})).sort((a,b)=>a.n-b.n || a.name.localeCompare(b.name))[0].tid;
}
const freeItems = () => [...Object.entries(S.leads||{}).filter(([,l])=>!l.tid && !l.st).map(([id,l])=>['lead',id,l]),
                         ...Object.entries(S.gchats||{}).filter(([,c])=>!c.tid).map(([id,c])=>['g',id,c])].sort((a,b)=>(a[2].at||0)-(b[2].at||0));
const assignTo = (k, id, tid) => S.db.doc((k==='g'?'gchat/':'leads/')+id).update({tid});
async function distributeAll(){
  const plan={}; let n=0;
  for(const [k,id,x] of freeItems()){ const tid=pickTeacher(x,plan); if(!tid) break; plan[tid]=(plan[tid]||0)+1; try{ await assignTo(k,id,tid); n++; }catch(e){ break; } }
  return n;
}
let asgBusy=false, asgT=null;
const asgSoon = () => { clearTimeout(asgT); asgT=setTimeout(autoAssign, 900); };
async function autoAssign(){
  if(S.role!=='owner' || !S.asgCfg?.auto || asgBusy || !S.teamLoaded || !S.loaded?.p || !S.loaded?.f || !freeItems().length) return;
  asgBusy=true; try{ const n=await distributeAll(); if(n) toast(tr('c.asgDone',{n})); }finally{ asgBusy=false; }
}

    </div>${gs.length?'':`<p class="small faint" style="margin-top:6px">${tr('c.startNoGroups')} <button type="button" class="btn ghost sm" data-act="go" data-v="groups">${tr('c.grpH')}</button></p>`}</div>
    <label class="field"><span>${tr('c.fMeet')} ${saved?'':`<a class="btn sm" href="https://meet.google.com/new" target="_blank" rel="noopener" style="margin-left:6px">${I.video} meet.google.com/new</a>`}</span><input class="inp" id="st-url" value="${esc(saved||'')}" placeholder="https://meet.google.com/abc-defg-hij"></label>
    <label class="small row" style="gap:8px;cursor:pointer"><input type="checkbox" id="st-keep" ${saved?'':'checked'}> ${tr('c.liveKeep')}</label>
    <p class="lg-err" id="st-err" role="alert"></p></div>
    <div class="dlg-foot"><button type="button" class="btn ghost" data-act="dlg-close">${tr('cancel')}</button><button class="btn pen">${I.video} ${tr('c.liveSend')}</button></div></form>`, {type:'start'});
  if(!document.querySelector('input[name="lv-to"]:checked')) document.querySelector('input[name="lv-to"][value="all"]').checked=true;
  $('#st-form').addEventListener('submit', async e=>{ e.preventDefault(); const err=$('#st-err'), url=$('#st-url').value.trim();
    if(!/^https:\/\/meet\.google\.com\//.test(url)){ err.textContent=tr('c.badMeet'); return; }
    const to=document.querySelector('input[name="lv-to"]:checked').value; let uids=[], label='';
    if(to==='all'){ uids=st.map(x=>x.uid); label=tr('c.startAll'); }
    else if(to==='one'){ const u=$('#st-one')?.value; if(!u){ err.textContent=tr('c.noStudentsYet'); return; } uids=[u]; label=st.find(x=>x.uid===u)?.name||''; LS.set('live-one:'+myTid(),u); }
    else { const g=gs.find(x=>'g:'+x.id===to); uids=g?.members||[]; label=g?.name||''; }
    if(!uids.length){ err.textContent=tr('c.startNobody'); return; }
    LS.set('live-to:'+myTid(),to);
    window.open(url,'_blank','noopener');
    try{ if($('#st-keep').checked && url!==saved){ await S.db.doc('teacherPriv/'+myTid()).set({meet:url}); if(S.role==='staff') S.myTPriv={meet:url}; else S.tpriv={...(S.tpriv||{}), [MAIN_TID]:{meet:url}}; }
      closeDlg(); await goLive(url, uids, label); }catch(x){ err.textContent=lgErrText(x); } });
}
async function setLiveFor(uids, tid, v){ for(const uid of uids) await S.db.doc('liveFor/'+uid).set({[tid]:v},{merge:true}); }
async function endLive(){

  await S.db.doc('live/'+tid).set({on:false, at:Date.now(), until:0, url:'', to:[], label:''});

const dayIdx = d => Math.floor(Date.parse(d+'T12:00:00Z')/864e5);

const clubPath = () => 'club/'+(S.clubLang||'English')+'_'+(S.clubDay||todayStr());
function clubStop(){ (S._clubUn||[]).forEach(u=>{ try{ u(); }catch(e){} }); S._clubUn=[]; S._clubKey=null; }
function startClub(){
  clubStop(); S.clubs={}; S.club=null; S.clubMsgs={};
  if(!S._clubHooked){ S._clubHooked=true; S.unsubs.push(()=>{ clubStop(); S._clubHooked=false; }); }
  clubSync();
}
// (re)start the listeners when the person's languages, the chosen club or the day change
function clubSync(){
  if(!S._clubHooked || !S.db || !langsReady()) return;
  const langs=myLangs(), saved=LS.get('club-lang','');
  if(!langs.includes(S.clubLang)) S.clubLang = langs.includes(saved) ? saved : (langs[0]||'');
  const day=todayStr(), key=langs.join(',')+'|'+S.clubLang+'|'+day; if(key===S._clubKey) return;
  (S._clubUn||[]).forEach(u=>{ try{ u(); }catch(e){} }); S._clubKey=key;
  S.clubDay=day; S.clubs={}; S.club=null; S.clubMsgs={}; S.clubErr=null;
  const cur=S.clubLang, fail = e => { S.clubErr=(e&&e.code)||'error'; if(S.view.name==='club') drawClubMsgs(); };
  S._clubUn = langs.map(l=>S.db.doc('club/'+l+'_'+day).onSnapshot(x=>{ if(x.exists) S.clubs[l]=x.data(); else delete S.clubs[l]; if(l===S.clubLang) S.club=S.clubs[l]||null;
      if(S.view.name==='club'){ drawClubTop(); drawClubTabs(); } else refreshAny(); }, l===cur?fail:()=>{}));
  if(cur) S._clubUn.push(S.db.collection(clubPath()+'/msgs').onSnapshot(q=>{ const o={}; q.docs.forEach(d=>{ if(d.exists) o[d.id]=d.data(); }); const n=Object.keys(o).length>Object.keys(S.clubMsgs||{}).length; S.clubMsgs=o; S.clubErr=null;
      if(S.view.name==='club') drawClubMsgs(n); else refreshAny(); }, fail));
  if(S.view.name==='club') renderMain();
}

/* ---------- library: e-books, audio and video by language and level (files live on Google Drive) ---------- */
// library/{id}: {lang, level, kind:'book'|'audio'|'video'|'link', title, desc, url, by, byName, at}
const LIB_KINDS = ['book','audio','video','link'];
const LIB_LEVELS = ['A1','A2','B1','B2','C1','C2','all'];
function driveId(u){ const m=String(u||'').match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/); return m?m[1]:null; }
const drivePreview = u => { const id=driveId(u); return id?`https://drive.google.com/file/d/${id}/preview`:null; };
const driveDownload = u => { const id=driveId(u); return id?`https://drive.google.com/uc?export=download&id=${id}`:u; };
const ytId = u => (String(u||'').match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/)||[])[1];
// staff and students read one language at a time (that is what firestore.rules allows); the owner reads everything
function libStop(){ (S._libUn||[]).forEach(u=>{ try{ u(); }catch(e){} }); S._libUn=[]; S._libKey=null; }
function startLib(){ libStop(); S.lib={}; S.libBy={}; if(!S._libHooked){ S._libHooked=true; S.unsubs.push(()=>{ libStop(); S._libHooked=false; }); } libSync(); }
function libSync(){
  if(!S._libHooked || !S.db || !langsReady()) return;
  const langs=myLangs(), key=langs.join(','); if(key===S._libKey) return;
  (S._libUn||[]).forEach(u=>{ try{ u(); }catch(e){} }); S._libKey=key; S.libBy={}; S.lib={};
  S._libUn = langs.map(l=>S.db.collection('library').where('lang',l).onSnapshot(q=>{ const o={}; q.docs.forEach(d=>{ if(d.exists) o[d.id]=d.data(); }); S.libBy[l]=o; S.lib=Object.assign({}, ...Object.values(S.libBy)); refreshAny(); }, ()=>{}));
}
const libIcon = k => k==='audio'?'🎧':k==='video'?'🎬':k==='link'?'🔗':'📘';
function vLibrary(){
  const items=Object.entries(S.lib||{}).map(([id,x])=>({id,...x}));
  const langs = S.role==='owner' ? [...new Set(items.map(x=>x.lang).filter(Boolean))].sort() : myLangs();
  const myLevel=S.mode==='student'?(S.myProfile?.level||''):'';
  const f=S.view; if(f.lang===undefined) f.lang=''; if(f.level===undefined) f.level=LIB_LEVELS.includes(myLevel)?myLevel:''; if(f.kind===undefined) f.kind='';
  const list=items.filter(x=>(!f.lang||x.lang===f.lang)&&(!f.level||x.level===f.level||x.level==='all')&&(!f.kind||x.kind===f.kind)).sort((a,b)=>(a.lang||'').localeCompare(b.lang||'')||LIB_LEVELS.indexOf(a.level)-LIB_LEVELS.indexOf(b.level)||b.at-a.at);
  const chips=(key,vals,label)=>`<div class="lp-filter" role="group" aria-label="${label}"><button data-act="c-lib-f" data-k="${key}" data-v="" aria-pressed="${!f[key]}">${tr('c.all')}</button>${vals.map(v=>`<button data-act="c-lib-f" data-k="${key}" data-v="${esc(v)}" aria-pressed="${f[key]===v}">${key==='kind'?libIcon(v)+' '+tr('c.lib.'+v):v==='all'?tr('c.libAllLv'):key==='lang'?esc(langName(v)):esc(v)}</button>`).join('')}</div>`;
  const canEdit = x => S.mode==='teacher' && (S.role==='owner' || x.by===S.staffTid);
  return `<div class="page-head"><div><h1>${tr('c.libH')}</h1><p>${tr('c.libP')}</p></div>${S.mode==='teacher'?`<button class="btn primary" data-act="c-lib">+ ${tr('c.libAdd')}</button>`:''}</div>
    ${langs.length>1?chips('lang',langs,tr('c.fLang')):''}${chips('level',LIB_LEVELS.slice(0,6),tr('c.fLevel'))}${chips('kind',LIB_KINDS,tr('c.libKind'))}
    ${langsReady()&&!myLangs().length?`<div class="notice">${tr('c.clubNoLang')}</div>`:''}${list.length?`<div class="lib-grid">${list.map(x=>{ const pv=drivePreview(x.url)||(ytId(x.url)?`https://www.youtube.com/embed/${ytId(x.url)}`:null);
      const yt=ytId(x.url);
      return `<article class="card lib">${yt?`<button class="lib-thumb" data-act="c-lib-open" data-id="${esc(x.id)}" aria-label="${tr('c.libOpen')}"><img src="https://img.youtube.com/vi/${yt}/mqdefault.jpg" alt="" loading="lazy"><span>▶</span></button>`:`<div class="lib-ic">${libIcon(x.kind)}</div>`}<div style="min-width:0;flex:1"><b>${esc(x.title)}</b>

async function uploadKeyFor(secret){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(secret+':upload')); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }

async function publishUpload(url, secret){ if(!url||!secret||S.demo) return; const key=await uploadKeyFor(secret); if(S.upCfg?.url===url && S.upCfg?.key===key) return; await S.db.doc('centre/upload').set({url, key}); S.upCfg={url, key}; }
const LIB_SMALL = 30*1024*1024, LIB_MAX = 1024*1024*1024;
const upCfgNow = async () => S.role==='owner' && S.mail?.url && S.mail?.secret ? {url:S.mail.url, key:await uploadKeyFor(S.mail.secret)} : S.upCfg;
const upCall = (cfg, b) => fetch(cfg.url,{method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({...b, key:cfg.key})}).then(r=>r.json());
// big files go straight to Google Drive in 8 MB parts (resumable upload opened by the script); small ones can also go through the script
async function uploadFile(file, onPct){
  if(S.demo){ for(let p=0;p<=1;p+=.25){ onPct&&onPct(p); await new Promise(r=>setTimeout(r,60)); } return {ok:true, url:'https://drive.google.com/file/d/1DemoUploadedFileForTheExample00/view'}; }
  const cfg=await upCfgNow();
  if(!cfg?.url || !cfg?.key) return {ok:false, error:'nocfg'};
  if(file.size>LIB_MAX) return {ok:false, error:'big'};
  try{
    const ses=await upCall(cfg, {action:'upsession', name:file.name, mime:file.type||'application/octet-stream', size:file.size, origin:location.origin});
    if(ses.ok && ses.url){
      const CH=8*1024*1024; let start=0, done=null;
      while(start<file.size){
        const end=Math.min(start+CH, file.size); let r=null;
        for(let tries=0; tries<3 && !r; tries++){ try{ r=await fetch(ses.url,{method:'PUT', headers:{'Content-Range':`bytes ${start}-${end-1}/${file.size}`}, body:file.slice(start,end)}); }catch(e){ await new Promise(w=>setTimeout(w,1500)); } }
        if(!r) return {ok:false, error:'network'};
        if(r.status===308){ const rg=r.headers.get('Range'); start = rg ? (+rg.split('-')[1]+1) : end; onPct&&onPct(start/file.size); continue; }
        if(r.ok){ done=await r.json(); onPct&&onPct(1); break; }
        return {ok:false, error:'HTTP '+r.status};
      }
      if(!done?.id) return {ok:false, error:'no file id'};
      const sh=await upCall(cfg, {action:'upshare', id:done.id});
      return sh.ok ? sh : {ok:false, error:sh.error||'share'};
    }
    if(!(ses.v>=6)){ // script v5 or older: only the small way works
      if(file.size>LIB_SMALL) return {ok:false, error:'old'};
      onPct&&onPct(.3);
      const data=await new Promise((ok,bad)=>{ const rd=new FileReader(); rd.onload=()=>ok(String(rd.result).split(',')[1]||''); rd.onerror=bad; rd.readAsDataURL(file); });
      const j=await upCall(cfg, {action:'upload', name:file.name, mime:file.type, data}); onPct&&onPct(1);
      if(!j.ok && !(j.v>=5)) return {ok:false, error:'old'}; return j;
    }
    return {ok:false, error:ses.error||'session'};
  }catch(e){ return {ok:false, error:String(e&&e.message||e)}; }
}

function streak(){
  const dates=new Set(Object.values(S.myEntries).map(e=>e.date)); let n=0; const d=new Date();
  const key=x=>x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
  if(!dates.has(key(d))) d.setDate(d.getDate()-1);
  while(dates.has(key(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
