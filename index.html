    case 'ste-mode': steRead(); S.ste.mode=b.dataset.m==='lesson'?'lesson':'words'; renderMain(); after.setEdit&&after.setEdit(); break;
    case 'ste-l-ai': { steRead(); const n=(S.ste.notes||'').trim(); if(!n){ toast(tr('st.lNeed')); break; } const t=lessonPrompt(n, S.ste.meta.level); try{ await navigator.clipboard.writeText(t); toast(tr('st.aiCopied')); }catch(e){ const i=$('#ste-l-in'); i.value=t; i.select(); toast(tr('t.selected')); } break; }
    case 'ste-l-in': { steRead(); const E=S.ste, n=(E.notes||'').trim(); if(!n){ toast(tr('st.lNeed')); break; }
      const res=lessonFromAi($('#ste-l-in').value, n); if(!res){ toast(tr('nw.aiBad')); break; }
      const have=parseWordLines(E.text), keys=new Set(have.map(x=>wNorm(x.w)));
      E.text=wordLinesText([...have, ...res.words.filter(x=>!keys.has(wNorm(x.w)))]);
      const gk=new Set((E.grammar||[]).map(g=>wNorm(g.t))); E.grammar=[...(E.grammar||[]), ...res.grammar.filter(g=>!gk.has(wNorm(g.t)))].slice(0,8);
      if(!E.meta.title && res.title) E.meta.title=res.title; E.fixes=res.fixes; E.mode='words'; E.dirty=true; renderMain(); after.setEdit&&after.setEdit(); window.scrollTo({top:0});
      toast(tr('st.lBuilt',{n:res.words.length, g:res.grammar.length, f:res.fixes.length})+(res.dropped?' '+tr('st.lDropped',{n:res.dropped}):'')); break; }
    case 'ste-g-del': { steRead(); if(!armDel(b)) break; S.ste.grammar.splice(+b.dataset.i,1); S.ste.dirty=true; renderMain(); after.setEdit&&after.setEdit(); break; }
    case 'ste-fix-x': S.ste.fixes=[]; renderMain(); after.setEdit&&after.setEdit(); break;
    case 'ste-prev': openSetPreview(); break;
    case 'ste-del': { if(!armDel(b)) break; const {id,uid}=S.ste, idx=clone(S.stIdx[uid])||{sets:[]}; idx.sets=(idx.sets||[]).filter(x=>x.id!==id);
      try{ await S.db.doc('study/'+id).delete(); await S.db.doc('studyIndex/'+uid).set(idx); S.stIdx[uid]=idx; toast(tr('bd.deleted')); S.ste=null; go('study'); }catch(e){ dbErr(e,'premium'); } break; }
    case 'bk-cancel': { if(b.classList.contains('del-btn') && !armDel(b)) break; const next=clone(S.myBook)||{items:[]}; next.items=(next.items||[]).filter(x=>x.id!==b.dataset.id); try{ await S.db.doc('bookings/'+S.uid).set(next); toast(b.classList.contains('del-btn')?tr('bd.deleted'):tr('bk.cancelled')); }catch(e){ dbErr(e,'book'); } break; }
  }
});
document.addEventListener('input', ev=>{
  const t=ev.target; if(!t || !t.classList) return;
  if(t.classList.contains('ts-in') && S.test){ S.test.ans[+t.dataset.i]=t.value; tsCount(); }
  if(t.classList.contains('nes-quiz')){ const el=t.parentElement.querySelector('.nes-qn'); if(el) el.textContent=tr('nw.e.qn',{n:parseQs(t.value).filter(x=>x.o).length}); }
  if(t.id==='ste-text') steCount();
  if(S.nwe && t.closest('.nwe-body, .switch-row') && S.view.name==='newsEdit') S.nwe.dirty=true;
  if(S.ste && t.closest('.ste-form')) S.ste.dirty=true;
});
document.addEventListener('change', ev=>{
  const t=ev.target; if(t.id==='nw-city'){ LS.set('nw-city',t.value); nwFillWeather(); }
  if(S.nwe && t.id==='nwe-on') S.nwe.dirty=true; if(t.dataset && t.dataset.act==='learn'){ const s=new Set(LS.get('learned:'+S.uid,[])); t.checked? s.add(t.dataset.w): s.delete(t.dataset.w); LS.set('learned:'+S.uid,[...s]); renderMain(); }
});
document.addEventListener('keydown', ev=>{
  if(S.pop && S.pop.a){
    if(ev.key==='Escape'){ closePop(); return; }
    if(ev.key==='Enter' && ev.target.closest('#pop') && ev.target.tagName==='INPUT'){ ev.preventDefault(); popSave(); return; }
    if(ev.altKey && /^[1-9]$/.test(ev.key)){ ev.preventDefault(); const t=TYPES[+ev.key-1]; S.pop.a.type=t.k; document.querySelectorAll('#pop .types .tchip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.k===t.k)); const w=$('#pf-fix-wrap'); if(w) w.hidden=t.k==='good'; }
  } else if(ev.key==='Escape') closePop();
  if(ev.key==='Enter' && (ev.target.id==='login-email'||ev.target.id==='login-pass')){ $('#main .paper .btn.primary')?.click(); }
  if(ev.key==='Enter' && ev.target.id==='bank-new'){ $('[data-act="bank-add"]').click(); }
  if(ev.key==='Enter' && ev.target.id==='plan-new'){ $('[data-act="plan-add"]')?.click(); }
  if(ev.key==='Enter' && ev.target.id==='qz-in'){ ev.preventDefault(); $('[data-act="qz-type"]')?.click(); }
  if(ev.key==='Enter' && ev.target.classList?.contains('ts-in')){ ev.preventDefault(); const all=[...document.querySelectorAll('.ts-in')], i=all.indexOf(ev.target); all[i+1]?.focus(); }
  if((ev.key==='Enter'||ev.key===' ') && ev.target.classList?.contains('mk')){ ev.preventDefault(); ev.target.click(); }
});
window.addEventListener('resize', ()=>{ if(S.pop) closePop(); });
/* teaching-centre buttons */
document.addEventListener('click', async ev => {
  const b=ev.target.closest('[data-act^="c-"]'); if(!b) return;
  const act=b.dataset.act;
  switch(act){
    case 'c-signin': S.view={name:'login', step:'signin', email:LS.get('last-email','')||''}; closeDlg(); renderTop(); renderNav(); renderMain(); window.scrollTo({top:0}); break;
    case 'c-landing': S.view={name:'landing'}; renderTop(); renderNav(); renderMain(); break;
    case 'c-lang': S.view.lang=b.dataset.l; renderMain(); break;
    case 'c-tprof': openTeacherProfile(b.dataset.tid); break;
    case 'c-trial': openTrial(b.dataset.tid||''); break;
    case 'c-gchat': openGuestChat(b.dataset.tid||''); break;
    case 'c-ch-open': S.mode==='student' ? go('chat',{tid:b.dataset.tid}) : go('chat',{k:b.dataset.k, id:b.dataset.id}); break;
    case 'c-ch-del': { const c=chatCur(); if(c) try{ await S.db.doc((c.kind==='g'?'gchat/':'dm/')+c.id+'/msgs/'+b.dataset.id).delete(); }catch(e){ dbErr(e,'svc'); } break; }
    case 'c-asg': { const sel=document.querySelector('[data-asg-sel="'+CSS.escape(b.dataset.id)+'"]'); b.disabled=true;
      try{ await assignTo(b.dataset.k, b.dataset.id, sel?.value||''); toast(tr('c.saved')); }catch(e){ dbErr(e,'svc'); } b.disabled=false; b.blur(); drawChat(); break; }
    case 'c-asg-all': { b.disabled=true; let n=0; try{ n=await distributeAll(); }catch(e){} toast(n?tr('c.asgDone',{n}):tr('c.asgNone')); b.disabled=false; break; }
    case 'c-asg-auto': try{ await S.db.doc('centre/assign').set({auto:!!b.checked}); }catch(e){ b.checked=!b.checked; dbErr(e,'svc'); } break;
    case 'c-allt': S.allT = b.dataset.on==='1'; refresh(); renderMain(); break;
    case 'c-tedit': openTeacherEdit(b.dataset.tid||null); break;
    case 'c-tdel': { const t=S.team[b.dataset.tid]; if(!t) break;
      if(!b.dataset.armed){ b.dataset.armed='1'; b.innerHTML=`${I.trash} ${tr('c.delSure')}`; toast(tr('c.delInfo',{name:t.name||''}),5000); break; }
      b.disabled=true; try{ await removeTeacher(b.dataset.tid); toast(tr('c.deleted')); }catch(e){ dbErr(e,'svc'); b.disabled=false; } break; }
    case 'c-bonus': { const tid=b.dataset.tid, t=S.team[tid]; if(!t) break; try{ await S.db.doc('teachers/'+tid).update({bonus:(+t.bonus||0)+(+b.dataset.n)}); }catch(e){ dbErr(e,'svc'); } break; }
    case 'c-lead-done': try{ await S.db.doc('leads/'+b.dataset.id).update({st:'done'}); }catch(e){ dbErr(e,'svc'); } break;
    case 'c-lead-del': if(!b.dataset.armed){ b.dataset.armed='1'; b.textContent=tr('del.sure'); break; } try{ await S.db.doc('leads/'+b.dataset.id).delete(); }catch(e){ dbErr(e,'svc'); } break;
    case 'c-offer': openOffer(b.dataset.id||null); break;
    case 'c-offer-del': { if(!b.dataset.armed){ b.dataset.armed='1'; b.textContent=tr('del.sure'); break; }
      try{ await S.db.doc('centre/offers').set({items:(S.offers?.items||[]).filter(x=>x.id!==b.dataset.id)}); }catch(e){ dbErr(e,'svc'); } break; }
    case 'c-sreq': { const tid=b.dataset.tid, r=S.sreq[tid]; if(!r) break; try{ await S.db.doc('staffReq/'+tid).set({...r, st:{...(r.st||{}), [b.dataset.id]:b.dataset.st}}); }catch(e){ dbErr(e,'svc'); } break; }
    case 'c-ask': openOfferAsk(b.dataset.id); break;
    case 'c-move': { const v=$('#stu-tid')?.value; if(!v) break; try{ await S.db.doc('journals/'+b.dataset.sid).update({teacher:v}); toast(tr('c.moved',{name:esc(tName(v))})); }catch(e){ dbErr(e,'journal'); } break; }
    case 'c-meet': openMeet(b.dataset.id); break;
    case 'c-apply': openApply(); break;
    case 'c-enroll': openEnroll(b.dataset.tid); break;
    case 'c-enroll-x': try{ await S.db.doc('enroll/'+S.uid).set({name:S.myProfile?.name||'', items:(S.myEnroll?.items||[]).filter(i=>i.tid!==b.dataset.tid)}); }catch(e){ dbErr(e,'svc'); } break;
    case 'c-en-set': b.disabled=true; try{ await setEnroll(b.dataset.uid, b.dataset.tid, b.dataset.st); }catch(e){ b.disabled=false; dbErr(e,'svc'); } break;
    case 'c-live': openStart(); break;
    case 'c-live-end': b.disabled=true; try{ await endLive(); }catch(e){ b.disabled=false; dbErr(e,'svc'); } break;
    case 'c-grp': openGroup(b.dataset.id||null); break;
    case 'c-grp-del': { if(!b.dataset.armed){ b.dataset.armed='1'; b.textContent=tr('del.sure'); break; } const list=myGroups().filter(g=>g.id!==b.dataset.id);
      try{ await S.db.doc('groups/'+myTid()).set({list}); S.myGroups={list}; renderMain(); }catch(e){ dbErr(e,'svc'); } break; }
    case 'c-club-topic': openClubTopic(); break;
    case 'c-club-video': openClubVideo(); break;
    case 'c-club-vend': try{ await S.db.doc(clubPath()).set({video:{on:false, at:Date.now(), until:0}},{merge:true}); S.club={...(S.club||{}), video:{on:false}}; drawClubTop(); }catch(e){ dbErr(e,'svc'); } break;
    case 'c-club-lang': S.clubLang=b.dataset.l; LS.set('club-lang', b.dataset.l); clubSync(); break;
    case 'c-club-del': try{ await S.db.doc(clubPath()+'/msgs/'+b.dataset.id).delete(); }catch(e){ dbErr(e,'svc'); } break;
    case 'c-lib': openLibEdit(b.dataset.id||null); break;
    case 'c-lib-open': openLibItem(b.dataset.id); break;
    case 'c-lib-f': S.view[b.dataset.k]=b.dataset.v; renderMain(); break;
    case 'c-lib-del': if(!b.dataset.armed){ b.dataset.armed='1'; b.textContent=tr('del.sure'); break; } try{ await S.db.doc('library/'+b.dataset.id).delete(); }catch(e){ dbErr(e,'svc'); } break;
    case 'c-tsvc': openTsvc(b.dataset.tid, b.dataset.id||null); break;
    case 'c-tsvc-del': { if(!b.dataset.armed){ b.dataset.armed='1'; b.textContent=tr('del.sure'); break; } const tid=b.dataset.tid;
      const left=(S.team?.[tid]?.services||[]).filter(x=>x.id!==b.dataset.id);
      try{ await S.db.doc('teachers/'+tid).update({services:left}); setSvcs(tid, left); }catch(e){ dbErr(e,'svc'); } break; }
    case 'c-order': closeDlg(); openOrder(b.dataset.tid, b.dataset.id); break;
    case 'c-ord-set': try{ await S.db.doc('torders/'+b.dataset.id).update({st:b.dataset.st}); }catch(e){ dbErr(e,'svc'); } break;
    case 'c-ord-x': try{ await S.db.doc('torders/'+b.dataset.id).delete(); }catch(e){ dbErr(e,'svc'); } break;
    case 'c-app-ok': b.disabled=true; try{ await acceptApp(b.dataset.id); }catch(e){ b.disabled=false; dbErr(e,'svc'); } break;
    case 'c-app-no': try{ await S.db.doc('applications/'+b.dataset.id).update({st:'no'}); }catch(e){ dbErr(e,'svc'); } break;
    case 'c-app-del': if(!b.dataset.armed){ b.dataset.armed='1'; b.textContent=tr('del.sure'); break; } try{ await S.db.doc('applications/'+b.dataset.id).delete(); }catch(e){ dbErr(e,'svc'); } break;
    case 'c-verify-again': try{ await S.au.sendEmailVerification(S.user); toast(tr('c.verifySent')); }catch(e){ toast(authMsg(e)); } break;
    case 'c-verified': { b.disabled=true; try{ await S.user.reload(); await S.user.getIdToken(true); }catch(e){}
      if(S.auth.currentUser?.emailVerified){ teardown(); startStaff(S.staffTid); } else { toast(tr('c.notYet')); b.disabled=false; } break; }
  }
});
function setLang(l){
  if(!DICT[l] || l===LANG) return;
  if(S.view.name==='login'){ const em=$('#login-email'); if(em) S.view.email=em.value; }
  const sn=$('#setup-name'); if(sn && S.me) S.me.name=sn.value;
  LANG=l; LS.set('lang',l); document.documentElement.lang=l; syncContact();
  const reopen = S.dlg; closeDlg();
  closePop(); renderTop(); renderNav(); renderMain();
  if(reopen?.type==='st') openLgStudent(reopen.id);
}
document.addEventListener('scroll', ()=>{ if(S.pop && !$('#pop .pop')?.contains(document.activeElement)) closePop(); }, {passive:true});

renderTop(); boot();
</script>
